services:
  portway:
    image: ghcr.io/melosso/portway:latest
    container_name: demo-portway
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config/environments:/app/environments:z
      - ./config/endpoints:/app/endpoints:z
      - ./log:/app/log:z
      - ./data:/app/data:z
      - type: bind
        source: ./data/auth.db
        target: /app/auth.db
        bind:
          create_host_path: false
          selinux: z
      - ./keys:/app/.core:z
    environment:
      - PORTWAY_ENCRYPTION_KEY=demo-encryption-key-12345
      - PORTWAY_ALLOWED_HOSTS=portway-demo.melosso.com;localhost
      - PORTWAY_KNOWN_NETWORKS=172.16.0.0/12
      - PORTWAY_SEED_TOKEN=pwdemo_4819cfc3d3dff6f0f63e7160a6422abee1ae07dd
      - PORTWAY_SECURE_COOKIES=true
      - PORTWAY_PUBLIC_ORIGINS=https://portway-demo.melosso.com
      - PORTWAY_PROMO_TEXT=This is a public demo instance. All data resets every 12 hours.
      - Console__Customization__PromoLogin=true
      - PORTWAY_LOGIN_FOOTER=Sign in with `admin` / `demo-admin-key` (read-only). API token for `/docs`: `pwdemo_4819cfc3d3dff6f0f63e7160a6422abee1ae07dd`. Read the [documentation](https://github.com/melosso/portway) to learn more.
      - "OpenApi__Description=This is a demo of Portway. A lightweight API gateway that connects your platforms to your data sources and services.\nSetup takes a few configuration files.\n\nResources to get started:\n\n* [Getting Started Guide](https://melosso.github.io/portway/). Step-by-step docs to get you moving.\n* [GitHub Repository](https://github.com/melosso/portway). Open source and ready for contributions.\n* [Docker Compose](https://github.com/melosso/portway?tab=readme-ov-file#alternative-docker-compose). Simple setup, and yes, we love \U0001F433.\n\nJoin the community on GitHub to track updates, report issues, and contribute. Portway is free to use under the EUPL 1.2 license. Distribution must be done under the same license.\n\n> [!NOTE]\n> This is a sandbox environment and resets every 12 hours.\n\nAuthenticate with the demo API token: `pwdemo_4819cfc3d3dff6f0f63e7160a6422abee1ae07dd`"
      - PORTWAY_MCP_ENABLED=true
      - Mcp__Path=/mcp
      - PORTWAY_CHAT_ENABLED=true
    depends_on:
      - nginx
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: demo-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro,z
    restart: unless-stopped
