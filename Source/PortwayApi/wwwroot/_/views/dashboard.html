<script>
const PERIOD_LABELS = { '24h': 'last 24 hours', '7d': 'last 7 days', '30d': 'last 30 days' };
let _period = '24h';
let _trafficChart, _errorChart;
let _checks = null, _blocked = [], _checkingRetry;

function note(text) { return `<p class="dash-note">${esc(text)}</p>`; }
function fmtN(n) { return n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'k' : String(n ?? 0); }
function fmtMs(ms) { return ms == null ? '—' : ms < 1 ? '<1 ms' : ms >= 1000 ? `${+(ms/1000).toFixed(1)} s` : `${Math.round(ms)} ms`; }
function fmtDuration(secs) {
  const d = Math.floor(secs / 86400), h = Math.floor(secs % 86400 / 3600), m = Math.floor(secs % 3600 / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : m ? `${m}m` : `${secs}s`;
}

const CHECK_NAMES = { Diskspace: 'Disk space', ProxyEndpoints: 'Proxy endpoints', SqlConnectivity: 'SQL connectivity' };
function checkName(n) { return CHECK_NAMES[n] ?? n.replace(/([a-z])([A-Z])/g, '$1 $2'); }

// next step per check and problem; the raw error stays in the logs
function nextStep(check, problem) {
  if (check === 'SqlConnectivity') {
    return problem === 'Timed out'
      ? 'Check the database server is reachable from Portway.'
      : "Check this environment's connection string and credentials.";
  }
  if (check === 'ProxyEndpoints') {
    if (problem === 'HTTP 404') return 'Check the endpoint URL.';
    if (/^HTTP 5/.test(problem)) return 'The upstream service failed. Check it is running.';
    if (/^HTTP 4/.test(problem)) return 'Check the endpoint URL and upstream credentials.';
    if (problem === 'Timed out') return 'The upstream took over 10 seconds. Check it is running.';
    return 'Check the host is reachable and allowed by the network policy.';
  }
  if (check === 'Diskspace') return 'Free up disk space on the Portway host.';
  return '';
}

function itemKind(check, href) {
  if (check === 'SqlConnectivity') return 'Environment';
  if (check === 'ProxyEndpoints') return href?.includes('#composite/') ? 'Composite endpoint' : 'Proxy endpoint';
  return checkName(check);
}

function itemName(name, href) {
  const m = /#(?:proxy|composite)\/(.+)$/.exec(href ?? '');
  return m ? m[1] : name;
}

const failing = s => s === 'Unhealthy' || s === 'Degraded';

function problemsAndHealthy(d) {
  const problems = [], healthy = [];
  for (const c of d.checks ?? []) {
    const items = c.items ?? [];
    for (const i of items) {
      const row = { check: c.name, name: itemName(i.name, i.href), kind: itemKind(c.name, i.href), href: i.href, problem: i.problem, warn: i.status === 'Degraded' };
      (failing(i.status) ? problems : healthy).push(row);
    }
    if (items.some(i => failing(i.status))) continue;
    const row = { check: c.name, name: checkName(c.name), kind: 'Check', problem: (c.description ?? '').replace(/^Health check status:\s*/i, ''), warn: c.status === 'Degraded', ms: c.duration_ms };
    if (failing(c.status)) problems.push(row);
    else if (!items.length) healthy.push(row);
  }
  return { problems, healthy };
}

const CHECK_ORDER = ['SqlConnectivity', 'ProxyEndpoints'];
const PLURAL = { Environment: 'environments', 'Proxy endpoint': 'proxy endpoints', 'Composite endpoint': 'composite endpoints' };

// environments before endpoints, failures before warnings; repeats of one problem share a row
function group(problems) {
  const rank = p => (p.warn ? 10 : 0) + (CHECK_ORDER.includes(p.check) ? CHECK_ORDER.indexOf(p.check) : CHECK_ORDER.length);
  const groups = new Map();
  for (const p of [...problems].sort((a, b) => rank(a) - rank(b))) {
    const key = `${p.check}|${p.kind}|${p.problem}|${p.warn}`;
    groups.set(key, [...(groups.get(key) ?? []), p]);
  }
  return [...groups.values()].map(g => g.length === 1 ? g[0] : {
    ...g[0], name: `${g.length} ${PLURAL[g[0].kind] ?? g[0].kind}`, kind: '', href: null, links: g
  });
}

function renderQueue() {
  const body = document.getElementById('queueBody');
  const status = document.getElementById('dashStatus');
  if (!_checks) return;
  if (_checks.checking) {
    status.innerHTML = '<span class="dash-dot"></span>Checking…';
    body.innerHTML = note('Checking…');
    document.getElementById('healthy').hidden = true;
    clearTimeout(_checkingRetry);
    _checkingRetry = setTimeout(loadChecks, 2000);
    return;
  }

  const { problems, healthy } = problemsAndHealthy(_checks);
  const blocked = _blocked.length
    ? [{ check: 'RateLimit', name: `${_blocked.length} client${_blocked.length === 1 ? '' : 's'} blocked`, kind: 'Rate limiting', href: '_/settings#performance', warn: true,
         step: 'Blocks clear on their own. Raise the limits if real clients are blocked.' }]
    : [];
  const open = [...group(problems), ...blocked];
  const bad = problems.filter(p => !p.warn).length;

  const checkedAt = new Date(_checks.checked_at ?? Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const count = problems.length + blocked.length;
  const tone = bad ? 'bad' : open.length ? 'warn' : 'ok';
  status.innerHTML = `<span class="dash-dot ${tone}"></span>`
    + (count
        ? `<strong>${count} ${count === 1 ? 'problem' : 'problems'}</strong>`
        : `<strong>All healthy</strong>`)
    + `<span>· checked ${esc(checkedAt)}</span>`;


  body.innerHTML = open.length
    ? `<ul class="queue">${open.map(p => {
        const step = p.step ?? nextStep(p.check, p.problem);
        const link = p.href ? `<a class="btn btn-outline btn-sm" href="_/${esc(p.href.replace(/^_\//, ''))}">Open</a>` : '';
        return `<li class="queue-item${p.warn ? ' is-warn' : ''}">
          ${statusIcon(p.warn ? 'warn' : 'bad', p.warn ? 'Degraded' : 'Unhealthy')}
          <div class="queue-head">
            <span class="queue-name">${esc(p.name)}</span>
            ${p.kind ? `<span class="queue-kind">${esc(p.kind)}</span>` : ''}
            ${p.problem ? `<span class="badge ${p.warn ? 'badge-warning' : 'badge-error'}">${esc(p.problem)}</span>` : ''}
          </div>
          <div class="queue-actions">${link}${p.check === 'RateLimit' ? '' : `<button type="button" class="btn btn-ghost btn-sm" data-on="click:recheck">Re-check</button>`}</div>
          ${step ? `<p class="queue-step">${esc(step)}</p>` : ''}
          ${p.links ? `<div class="queue-links">${p.links.map(l => l.href ? `<a href="_/${esc(l.href)}">${esc(l.name)}</a>` : `<span>${esc(l.name)}</span>`).join('')}</div>` : ''}
        </li>`;
      }).join('')}</ul>`
    : `<div class="queue-clear">${statusIcon('ok', 'Healthy')}<strong>Nothing needs attention.</strong></div>`;

  const details = document.getElementById('healthy');
  details.hidden = !healthy.length;
  document.getElementById('healthyLabel').textContent = `Healthy (${healthy.length})`;
  document.getElementById('healthyList').innerHTML = healthy.map(h => `
    <li>${statusIcon('ok', 'Healthy')}<span class="queue-name">${esc(h.name)}</span><span class="queue-kind">${esc(h.ms != null ? fmtMs(h.ms) : h.kind)}</span></li>`).join('');
  const version = (_checks.version ?? '').split('+')[0];
  document.getElementById('dashFoot').textContent = `${version ? `Portway ${version} · ` : ''}up ${fmtDuration(_checks.uptime_seconds ?? 0)}`;
}

function renderChecksError() {
  document.getElementById('dashStatus').innerHTML = '<span class="dash-dot"></span>Health checks unavailable';
  document.getElementById('queueBody').innerHTML = '<p class="dash-alert">Health checks unavailable. Re-check to retry.</p>';
}

async function loadChecks() {
  try {
    _checks = await api('/_/api/health/checks', { silent: true });
    renderQueue();
  } catch (e) {
    renderChecksError();
  }
}

async function loadBlocked() {
  try {
    const d = await api('/_/api/ratelimits', { silent: true });
    _blocked = d.enabled ? [...(d.blocked_ips ?? []), ...(d.blocked_tokens ?? [])] : [];
  } catch (e) {
    _blocked = [];
  }
  renderQueue();
}

async function loadTraffic() {
  const tone = (el, t) => { el.classList.remove('is-warn', 'is-bad'); if (t) el.classList.add(t); };
  const total = document.getElementById('tsTotal');
  const success = document.getElementById('tsSuccess');
  const failures = document.getElementById('tsFailures');
  const p95 = document.getElementById('tsP95');
  document.querySelectorAll('[data-health-link]').forEach(a => a.href = `_/health?period=${_period}`);
  try {
    const [health, metrics] = await Promise.all([
      api(`/_/api/metrics/health?period=${_period}`, { silent: true }),
      api(`/_/api/metrics?period=${_period}`, { silent: true })
    ]);
    const s = health.summary ?? {};
    total.textContent = fmtN(s.total ?? 0);
    success.textContent = s.success_rate == null ? '—' : `${(s.success_rate * 100).toFixed(s.success_rate >= 0.999 && s.success_rate < 1 ? 2 : 1)}%`;
    tone(success, s.success_rate == null || s.success_rate >= 0.999 ? null : s.success_rate >= 0.95 ? 'is-warn' : 'is-bad');
    failures.textContent = s.total ? fmtN(s.failures ?? 0) : '—';
    tone(failures, s.failures ? 'is-bad' : null);
    p95.textContent = fmtMs(s.p95);
    tone(p95, s.p95 != null && s.p95 > 300 ? 'is-warn' : null);

    if (metrics.api_traffic?.some(b => b.count > 0) || metrics.ui_traffic?.some(b => b.count > 0)) _trafficChart.setData(metrics.api_traffic, metrics.ui_traffic);
    else _trafficChart.setEmpty(`No traffic yet · collecting for ${fmtDuration(metrics.collecting_for_secs ?? 0)}`);
    _errorChart.setData(metrics.errors ?? {}, metrics.total ?? 0);
    const errorCount = Object.values(metrics.errors ?? {}).reduce((a, n) => a + n, 0);
    document.getElementById('trafficChart').setAttribute('aria-label', `Requests, ${PERIOD_LABELS[_period]}: ${metrics.api_requests ?? 0} API and ${metrics.ui_requests ?? 0} console`);
    document.getElementById('errorChart').setAttribute('aria-label', `HTTP errors, ${PERIOD_LABELS[_period]}: ${errorCount} responses with an error status`);
    renderTopEndpoints(metrics.top_endpoints ?? []);
    document.getElementById('metricsError').hidden = true;
  } catch (e) {
    for (const el of [total, success, failures, p95]) { el.textContent = '—'; tone(el, null); }
    document.getElementById('metricsError').hidden = false;
  }
}

function renderTopEndpoints(eps) {
  const el = document.getElementById('topEndpointsBody');
  if (!eps.length) { el.innerHTML = note('No API requests in this period'); return; }
  const max = eps[0].count;
  el.innerHTML = `<ol class="top-ep-list">${eps.map((ep, i) => `
    <li class="top-ep-item">
      <span class="top-ep-rank">${i + 1}</span>
      <a class="top-ep-name" href="_/health?${new URLSearchParams({ period: _period, endpoint: ep.name })}">${esc(ep.name)}</a>
      <span class="top-ep-count">${fmtN(ep.count)} req</span>
      <div class="top-ep-bar-track" aria-hidden="true"><div class="top-ep-bar-fill" style="transform:scaleX(${(ep.count / max).toFixed(3)})"></div></div>
    </li>`).join('')}</ol>`;
}

async function recheck() {
  const buttons = document.querySelectorAll('[data-on="click:recheck"]');
  buttons.forEach(b => { b.classList.add('is-refreshing'); b.disabled = true; });
  try {
    _checks = await api('/_/api/health/checks/refresh', { method: 'POST', failure: 'Re-check failed' });
    renderQueue();
  } catch (e) {}
  await Promise.allSettled([loadBlocked(), loadTraffic()]);
  document.querySelectorAll('[data-on="click:recheck"]').forEach(b => { b.classList.remove('is-refreshing'); b.disabled = false; });
}

let _sseAbort = null, _sseDelay = 1000;

function connectSSE() {
  if (_sseAbort) _sseAbort.abort();
  _sseAbort = new AbortController();
  fetch('/_/api/events', { credentials: 'same-origin', signal: _sseAbort.signal })
    .then(response => {
      if (!response.ok) throw new Error(`SSE ${response.status}`);
      _sseDelay = 1000;
      const reader = response.body.getReader(), decoder = new TextDecoder();
      let buffer = '';
      function read() {
        reader.read().then(({ done, value }) => {
          if (done) { scheduleSSEReconnect(); return; }
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n'); buffer = lines.pop();
          let type = '', data = '';
          for (const line of lines) {
            if (line.startsWith('event: ')) type = line.slice(7).trim();
            else if (line.startsWith('data: ')) data = line.slice(6);
            else if (line === '' && type && data) { if (type === 'health') loadChecks(); type = ''; data = ''; }
          }
          read();
        }).catch(err => { if (err.name !== 'AbortError') scheduleSSEReconnect(); });
      }
      read();
    })
    .catch(err => { if (err.name !== 'AbortError') scheduleSSEReconnect(); });
}

function scheduleSSEReconnect() {
  if (!_sseAbort) return;
  setTimeout(() => { if (_sseAbort) connectSSE(); }, _sseDelay);
  _sseDelay = Math.min(_sseDelay * 2, 30000);
}

document.addEventListener('keydown', e => {
  if (e.key !== 'r' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  e.preventDefault();
  recheck();
});

document.addEventListener('DOMContentLoaded', () => {
  _trafficChart = new AreaChart(document.getElementById('trafficChart'));
  _errorChart = new ErrorChart(document.getElementById('errorChart'));
  new ChartPeriodSelector(document.getElementById('periodSel'), ['24h', '7d', '30d'], p => {
    _period = p;
    loadTraffic();
  });
  Promise.allSettled([loadChecks(), loadBlocked(), loadTraffic()]);
  // health arrives through the event stream; rate limit blocks have no event
  setInterval(loadBlocked, 30000);
  connectSSE();
  SetupGuide.init('setupGuide');
});
</script>
