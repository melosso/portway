<script>
const ENDPOINT_TYPES = [
  {
    key: 'sql', label: 'SQL', dotClass: 'dot-sql',
    fields: ['name','methods','schema','object_name','object_type','allowed_columns','hidden','enabled','deprecated','is_mcp_exposed','allowed_environments','documentation'],
    defaultContent: { DatabaseObjectName: '', DatabaseSchema: 'dbo', DatabaseObjectType: 'Table', AllowedMethods: ['GET'], Hidden: false, Enabled: true }
  },
  {
    key: 'proxy', label: 'Proxy', dotClass: 'dot-proxy',
    fields: ['name','url','methods','hidden','enabled','deprecated','is_mcp_exposed','allowed_environments','documentation'],
    defaultContent: { Url: '', AllowedMethods: ['GET'], Hidden: false, Enabled: true }
  },
  {
    key: 'composite', label: 'Composite', dotClass: 'dot-composite',
    fields: ['name','methods','hidden','enabled','deprecated','is_mcp_exposed','allowed_environments','composite_steps','documentation'],
    defaultContent: { Type: 'Composite', AllowedMethods: ['GET'], Hidden: false, Enabled: true, CompositeConfig: { Steps: [] } }
  },
  {
    key: 'file', label: 'File', dotClass: 'dot-file',
    fields: ['name','methods','storage_type','base_directory','allowed_extensions','hidden','enabled','deprecated','is_mcp_exposed','allowed_environments'],
    defaultContent: { StorageType: 'Local', BaseDirectory: '', AllowedExtensions: ['.jpg','.png','.pdf'], AllowedMethods: ['GET','POST'], Hidden: false, Enabled: true }
  },
  {
    key: 'static', label: 'Static', dotClass: 'dot-static',
    fields: ['name','methods','hidden','enabled','deprecated','is_mcp_exposed','allowed_environments'],
    defaultContent: { AllowedMethods: ['GET'], Hidden: false, Enabled: true }
  },
  {
    key: 'webhook', label: 'Webhook', dotClass: 'dot-webhook',
    fields: ['methods','schema','object_name','allowed_columns','hidden','enabled','deprecated','is_mcp_exposed','documentation'],
    defaultContent: { DatabaseObjectName: 'WebhookData', DatabaseSchema: 'dbo', AllowedMethods: ['POST'], AllowedColumns: [], Hidden: false, Enabled: true }
  }
];

let _allData = {};        // { sql: [...], proxy: [...], ... }
let _activeTab = 'all';   // tab key or 'all'
let _selected = null;     // { type, name }
let _detailData = null;   // raw content from GET /_/api/endpoints/{type}/{name}
let _dirty = false;
let _rawMode = false;
let _renaming = false;
let _createType = 'sql';
let _confirmingDelete = false;
let _allowedEnvs = [];
let _webhookPresets = {};

function markDirty() { _dirty = true; syncDirty(); }

function syncDirty() {
  const label = document.getElementById('epDirty');
  if (label) label.hidden = !_dirty;
}

function stateBadges(c) {
  return [[c?.Enabled === false, 'Disabled'], [c?.Hidden === true, 'Hidden'], [c?.Deprecated === true, 'Deprecated']]
    .filter(([on]) => on).map(([, label]) => `<span class="badge badge-warning ep-state">${label}</span>`).join('');
}

function confirmNavigate(onConfirm) {
  if (!_dirty) {
    onConfirm();
    return;
  }
  
  AlertDialog.show({
    title: 'Discard changes?',
    description: 'Unsaved endpoint changes are discarded.',
    actionLabel: 'Leave anyway',
    cancelLabel: 'Stay here',
    onConfirm: () => {
      _dirty = false;
      onConfirm();
    }
  });
}

function confirmNavigateSync() {
  if (!_dirty) return true;
  return confirm('Discard unsaved changes?');
}

window.addEventListener('beforeunload', e => {
  if (_dirty) { e.preventDefault(); e.returnValue = ''; }
});

async function refreshAll() {
  confirmNavigate(async () => {
    try {
      const d = await api('/_/api/endpoints', { silent: true });
      if (!_allowedEnvs.length) {
        try { _allowedEnvs = (await api('/_/api/environments', { silent: true })).allowed_environments ?? []; } catch (e) {}
      }
      _allData = {
        sql:       (d.sql ?? []).map(e => ({ ...e, _type: 'sql' })),
        proxy:     (d.proxy ?? []).map(e => ({ ...e, _type: 'proxy' })),
        composite: (d.composite ?? []).map(e => ({ ...e, _type: 'composite' })),
        file:      (d.file ?? []).map(e => ({ ...e, _type: 'file' })),
        static:    (d.static ?? []).map(e => ({ ...e, _type: 'static' })),
        webhook:   (d.webhook ?? []).map(e => ({ ...e, _type: 'webhook' })),
      };
      renderTabs();
      renderList();
      if (_selected) selectEndpoint(_selected.type, _selected.name, false, 'none');
    } catch(e) {
      toast('Failed to load endpoints: ' + e.message, 'error');
    }
  });
}

function renderTabs() {
  const count = key => resourcesOf(key === 'all' ? Object.values(_allData).flat() : (_allData[key] ?? [])).length;
  const options = [{ key: 'all', label: 'All types' }, ...ENDPOINT_TYPES.map(t => ({ key: t.key, label: t.label }))];
  document.getElementById('epType').innerHTML = options
    .map(o => `<option value="${o.key}" ${_activeTab === o.key ? 'selected' : ''}>${esc(o.label)} (${count(o.key)})</option>`)
    .join('');
}

function switchTab(key) {
  document.getElementById('epType').value = _activeTab;
  confirmNavigate(() => {
    _activeTab = key;
    renderTabs();
    renderList();
  });
}

// Resources: one entry per endpoint path and type, holding its versions in order
function versionNumber(item) {
  return item.version ? parseInt(item.version.slice(1), 10) : 1;
}

function resourcesOf(items) {
  const map = new Map();
  for (const item of items) {
    const base = baseName(item);
    const key = `${item._type}:${base}`;
    if (!map.has(key)) {
      const cut = base.lastIndexOf('/');
      map.set(key, { type: item._type, base, ns: cut < 0 ? '' : base.slice(0, cut), leaf: base.slice(cut + 1), versions: [] });
    }
    map.get(key).versions.push(item);
  }
  for (const r of map.values()) r.versions.sort((a, b) => versionNumber(a) - versionNumber(b));
  return [...map.values()];
}

function selectedResource() {
  if (!_selected) return null;
  const base = selectedVersion() ? _selected.name.slice(0, _selected.name.lastIndexOf('/')) : _selected.name;
  return resourcesOf(_allData[_selected.type] ?? []).find(r => r.base === base) ?? null;
}

function getFilteredItems() {
  const q = (document.getElementById('epSearch')?.value ?? '').toLowerCase();
  const types = _activeTab === 'all' ? ENDPOINT_TYPES.map(t => t.key) : [_activeTab];
  const results = [];
  for (const type of types) {
    for (const item of (_allData[type] ?? [])) {
      if (!q || (item.name ?? '').toLowerCase().includes(q) || type.includes(q) || (item.scope ?? '').toLowerCase().includes(q)) {
        results.push(item);
      }
    }
  }
  return results;
}

function trySelect(type, name) {
  confirmNavigate(() => selectEndpoint(type, name));
}

function renderList() {
  const scroll = document.getElementById('epListScroll');
  const items = getFilteredItems();

  if (!items.length) {
    const totalAll = Object.values(_allData).reduce((s, a) => s + (a?.length ?? 0), 0);
    const isFiltered = (document.getElementById('epSearch')?.value ?? '').length > 0 || _activeTab !== 'all';
    if (isFiltered || totalAll > 0) {
      scroll.innerHTML = `<div class="ep-empty" style="padding:1.5rem;font-size:0.8rem">No endpoints found</div>`;
    } else {
      scroll.innerHTML =
        `<div style="padding:1.75rem 1.5rem;display:flex;flex-direction:column;gap:0.6rem">` +
          `<div style="font-size:0.82rem;font-weight:500;color:hsl(var(--foreground))">No endpoints configured</div>` +
          `<div style="font-size:0.76rem;color:hsl(var(--muted-foreground));line-height:1.5">` +
            `Add an <code style="font-size:0.73rem;background:hsl(var(--muted));padding:0.1em 0.35em;border-radius:3px">entity.json</code> ` +
            `file to the <code style="font-size:0.73rem;background:hsl(var(--muted));padding:0.1em 0.35em;border-radius:3px">endpoints/</code> directory.` +
          `</div>` +
          `<pre style="font-size:0.72rem;color:hsl(var(--muted-foreground));line-height:1.6;margin:0.25rem 0 0;` +
            `background:hsl(var(--muted));border-radius:4px;padding:0.65rem 0.75rem;overflow:hidden">` +
            `endpoints/\n` +
            `└── SQL/\n` +
            `    └── Products/\n` +
            `        ├── entity.json\n` +
            `        └── v2/\n` +
            `            └── entity.json` +
          `</pre>` +
        `</div>`;
    }
    return;
  }

  const byNamespace = new Map();
  for (const r of resourcesOf(items)) {
    const ns = r.ns || 'General';
    if (!byNamespace.has(ns)) byNamespace.set(ns, []);
    byNamespace.get(ns).push(r);
  }

  const current = selectedResource();
  let html = '';
  for (const ns of [...byNamespace.keys()].sort((a, b) => a.localeCompare(b))) {
    html += `<div class="ep-list-group">${esc(ns)}</div>`;
    for (const r of byNamespace.get(ns).sort((a, b) => a.leaf.localeCompare(b.leaf))) {
      const typeCfg = ENDPOINT_TYPES.find(t => t.key === r.type);
      const latest = r.versions[r.versions.length - 1];
      const isActive = current?.type === r.type && current?.base === r.base;
      const retired = r.versions.every(v => v.deprecated);
      const versions = r.versions.length > 1 ? r.versions.map(v => v.version ?? 'v1').join(' · ') : '';
      html += `<div class="ep-list-item ${isActive ? 'active' : ''}${retired ? ' is-deprecated' : ''}" onclick="trySelect('${esc(r.type)}','${esc(latest.name)}')" title="${esc(typeCfg?.label ?? r.type)}">
        <span class="ep-type-dot ${typeCfg?.dotClass ?? ''}"></span>
        <span class="ep-list-name">${esc(r.leaf)}</span>
        ${versions ? `<span class="ep-list-versions">${esc(versions)}</span>` : ''}
      </div>`;
    }
  }
  scroll.innerHTML = html;
}

function baseName(item) {
  return item.version ? item.name.slice(0, -(item.version.length + 1)) : item.name;
}

function selectedVersion() {
  const leaf = _selected?.name.split('/').pop() ?? '';
  return /^v[1-9][0-9]{0,2}$/.test(leaf) ? leaf : null;
}

function filterList() {
  renderList();
}

function selectionHash(type, name) {
  return `#${type}/${name}`;
}

function selectionFromHash() {
  const m = /^#([a-z]+)\/([A-Za-z0-9_\-\/]+)$/.exec(decodeURIComponent(location.hash));
  return m && ENDPOINT_TYPES.some(t => t.key === m[1]) ? { type: m[1], name: m[2] } : null;
}

function syncSplit() {
  document.querySelector('.ep-split')?.classList.toggle('has-selection', !!_selected);
}

function clearSelection() {
  _selected = null;
  _detailData = null;
  _dirty = false;
  _renaming = false;
  document.getElementById('epDetail').innerHTML = `<div class="ep-empty">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      <span>Select an endpoint</span>
    </div>`;
  renderList();
  syncSplit();
}

function closeDetail() {
  confirmNavigate(() => {
    if (history.state?.fromList) { history.back(); return; }
    clearSelection();
    history.replaceState(null, '', location.pathname + location.search);
  });
}

window.addEventListener('popstate', () => {
  const target = selectionFromHash();
  if (target && _selected && target.type === _selected.type && target.name === _selected.name) return;
  if (_dirty && !confirmNavigateSync()) {
    if (_selected) history.pushState({ fromList: true }, '', selectionHash(_selected.type, _selected.name));
    return;
  }
  _dirty = false;
  if (target) selectEndpoint(target.type, target.name, false, 'none');
  else clearSelection();
});

async function selectEndpoint(type, name, scroll = true, history_ = 'push') {
  _selected = { type, name };
  _confirmingDelete = false;
  renderList();
  syncSplit();
  const hash = selectionHash(type, name);
  if (history_ !== 'none' && decodeURIComponent(location.hash) !== hash) {
    if (history_ === 'replace') history.replaceState({ fromList: history.state?.fromList === true }, '', hash);
    else history.pushState({ fromList: true }, '', hash);
  }
  if (scroll && matchMedia('(max-width: 768px)').matches) document.querySelector('main')?.scrollTo(0, 0);

  const detail = document.getElementById('epDetail');
  detail.innerHTML = `<div class="ep-empty"><span style="font-size:0.8rem;color:hsl(var(--muted-foreground))">Loading…</span></div>`;

  try {
    const d = await api(`/_/api/endpoints/${type}/${name}`, { silent: true });
    _detailData = d;
    _dirty = false;
    _rawMode = false;
    renderDetail();
  } catch(e) {
    detail.innerHTML = `<div class="ep-empty"><span style="color:hsl(var(--destructive))">Error: ${esc(e.message)}</span></div>`;
  }
}

function renderDetail() {
  if (!_detailData) return;
  const { name, type, content, raw } = _detailData;
  const typeCfg = ENDPOINT_TYPES.find(t => t.key === type);
  const detail = document.getElementById('epDetail');
  const isWebhook = type === 'webhook';
  const version = selectedVersion();

  const nameDisplay = _renaming
    ? `<input type="text" id="renameInput" value="${esc(name.split('/').pop())}" class="input input-title" onkeydown="if(event.key==='Enter')confirmRename();if(event.key==='Escape')cancelRename()" autofocus>
       <button class="btn btn-primary btn-sm" onclick="confirmRename()">Save</button>
       <button class="btn btn-outline btn-sm" onclick="cancelRename()">Cancel</button>`
    : `<h2>${esc(version ? name.slice(0, -(version.length + 1)) : name)}</h2>
       <span class="badge badge-muted" style="font-size:0.7rem">${esc(typeCfg?.label ?? type)}</span>${stateBadges(_detailData?.content)}`;

  detail.innerHTML = `
    <div class="ep-detail-header">
      <button type="button" class="btn btn-ghost btn-icon ep-back" onclick="closeDetail()" aria-label="Back to endpoints" title="Back to endpoints">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="ep-type-dot ${typeCfg?.dotClass ?? ''}"></span>
      ${nameDisplay}
      ${_renaming ? '' : `<div class="actions">
        ${version ? '' : `<button class="btn btn-outline btn-sm" onclick="startRename()" data-tooltip="Rename endpoint name">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Rename
        </button>`}
        <button class="btn btn-outline btn-sm" onclick="toggleRawMode()">
          ${_rawMode ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> Structured' : '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg> Raw JSON'}
        </button>
        ${isWebhook ? `<button class="btn btn-outline btn-sm" onclick="openDeliveries()" data-tooltip="Latest stored deliveries">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
          Deliveries
        </button>` : ''}
        <button class="btn btn-outline btn-sm" onclick="startDelete()" style="color:hsl(var(--destructive-text));border-color:hsl(var(--destructive)/0.4)" data-tooltip="Delete endpoint permanently">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          Delete
        </button>
      </div>`}
    </div>
    ${_renaming ? '' : renderVersionBar(type)}
    <div class="ep-detail-body" id="epDetailBody">
      ${_rawMode ? renderRawForm(raw) : renderStructuredForm(type, content)}
    </div>
    <div class="ep-save-bar" style="padding:0.75rem 1rem;border-top:1px solid hsl(var(--border));display:flex;gap:0.5rem;justify-content:flex-end;align-items:center;flex-shrink:0">
      <span id="epDirty" class="ep-dirty" role="status" ${_dirty ? '' : 'hidden'}>Unsaved changes</span>
      <button class="btn btn-outline btn-sm" onclick="reloadDetail()">Discard</button>
      <button id="epSaveBtn" class="btn btn-primary btn-sm" onclick="saveEndpoint()">
        <span class="btn-label"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Save</span>
        <span class="btn-spinner"></span>
      </button>
    </div>`;
  if (isWebhook && !_rawMode) wireWebhookForm();
}

async function openDeliveries() {
  const name = _selected?.name;
  if (!name) return;
  document.getElementById('deliveriesTitle').textContent = `Deliveries · ${name}`;
  const allowed = _detailData?.content?.AllowedEnvironments;
  let envs = Array.isArray(allowed) && allowed.length ? allowed : [];
  if (!envs.length) {
    try { envs = (await api('/_/api/environments', { silent: true })).allowed_environments ?? []; } catch (e) {}
  }
  document.getElementById('deliveriesEnv').innerHTML = envs.map(e => `<option value="${esc(e)}">${esc(e)}</option>`).join('');
  Drawer.open('deliveriesDrawer');
  await loadDeliveries();
}

function prettyPayload(payload) {
  try { return JSON.stringify(JSON.parse(payload), null, 2); } catch { return payload; }
}

async function loadDeliveries() {
  const list = document.getElementById('deliveriesList');
  const env = document.getElementById('deliveriesEnv').value;
  if (!env) { list.innerHTML = `<div class="secret-empty">No environment allows this endpoint.</div>`; return; }
  list.innerHTML = `<div class="secret-empty">Loading…</div>`;
  try {
    const d = await api(`/_/api/webhooks/${_selected.name.split('/').map(encodeURIComponent).join('/')}/deliveries?env=${encodeURIComponent(env)}`, { silent: true });
    const rows = d.deliveries ?? [];
    list.innerHTML = rows.length
      ? `<div class="wh-deliveries">
          <div class="wh-delivery-head"><span>ID</span><span>Webhook ID</span><span>Received</span></div>
          ${rows.map(r => `<details class="wh-delivery">
            <summary><span class="mono">${esc(r.id)}</span><span class="wh-id">${esc(r.webhook_id)}</span><span class="mono muted">${esc(new Date(r.received_at).toLocaleString())}</span></summary>
            <pre class="wh-payload">${esc(prettyPayload(r.payload))}</pre>
          </details>`).join('')}
        </div>`
      : `<div class="secret-empty">No deliveries in ${esc(env)}.</div>`;
  } catch (e) {
    list.innerHTML = `<div class="secret-empty" style="color:hsl(var(--destructive))">${esc(e.status === 403 ? 'Deliveries need an administrator account.' : e.message)}</div>`;
  }
}

function renderRawForm(raw) {
  const pretty = (() => { try { return JSON.stringify(JSON.parse(raw), null, 2); } catch { return raw; } })();
  return `<div class="ep-raw-editor">
    <textarea id="rawContent" class="input input-code" spellcheck="false">${esc(pretty)}</textarea>
  </div>`;
}

function renderStructuredForm(type, content) {
  const c = content ?? {};
  let inner;
  switch(type) {
    case 'sql':       inner = renderSqlForm(c);       break;
    case 'proxy':     inner = renderProxyForm(c);     break;
    case 'composite': inner = renderCompositeForm(c); break;
    case 'file':      inner = renderFileForm(c);      break;
    case 'static':    inner = renderStaticForm(c);    break;
    case 'webhook':   inner = renderWebhookForm(c);   break;
    default:          return `<div class="ep-empty">Unknown type</div>`;
  }
  return `<div class="ep-form">${inner}${renderLifecycleCard(c)}</div>`;
}

function renderVersionBar(type) {
  const r = selectedResource();
  if (!r) return '';
  const item = r.versions.find(v => v.name === _selected.name) ?? r.versions[0];
  const version = item.version ?? 'v1';
  const prefix = version === 'v1' ? '' : version + '/';
  const route = type === 'file' ? `/api/{env}/${prefix}files/${r.base}` : `/api/{env}/${prefix}${r.base}`;
  const chips = r.versions.map(v => {
    const label = v.version ?? 'v1';
    const active = v.name === _selected.name;
    const state = v.deprecated ? (v.sunset ? `Deprecated, sunset ${String(v.sunset).slice(0, 10)}` : 'Deprecated') : 'Active';
    return `<button type="button" class="ep-version-chip${active ? ' active' : ''}${v.deprecated ? ' is-deprecated' : ''}" aria-pressed="${active}" data-tooltip="${esc(state)}" onclick="trySelect('${esc(type)}','${esc(v.name)}')">${esc(label)}</button>`;
  }).join('');
  return `<div class="ep-version-bar">
    <div class="ep-version-chips" role="group" aria-label="Versions">
      ${chips}
      ${type === 'webhook' ? '' : `<button type="button" class="ep-version-chip ep-version-add" onclick="createVersion()" data-tooltip="Copy ${esc(version)} into the next version">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Version
      </button>`}
    </div>
    <div class="ep-version-meta">
      <button type="button" class="ep-copy" onclick="copyText('${esc(route)}')" data-tooltip="Copy route"><code>${esc(route)}</code></button>
      <button type="button" class="ep-copy" onclick="copyText('${esc(item.scope ?? r.base)}')" data-tooltip="Copy token scope"><code>${esc(item.scope ?? r.base)}</code></button>
    </div>
  </div>`;
}

function copyText(text) {
  navigator.clipboard?.writeText(text).then(() => toast('Copied', 'success'), () => toast('Copy failed', 'error'));
}

function dateValue(value) {
  return value ? String(value).slice(0, 10) : '';
}

function renderLifecycleCard(c) {
  const stability = ['Stable', 'Experimental'].find(s => s.toLowerCase() === String(c.Stability ?? '').toLowerCase()) ?? 'Not set';
  const set = !!(c.Stability || c.Deprecated || c.DeprecatedSince || c.Sunset);
  return accordion('Lifecycle', `
    ${fieldSelect('lcStability', 'Stability', stability, ['Not set', 'Stable', 'Experimental'])}
    ${fieldToggle('lcDeprecated', 'Deprecated', c.Deprecated ?? false)}
    <div class="ep-lifecycle-dates">
      <div class="field">
        <label class="field-label" for="lcDeprecatedSince">Deprecated since</label>
        <input type="date" class="input" id="lcDeprecatedSince" value="${esc(dateValue(c.DeprecatedSince))}" oninput="markDirty()">
      </div>
      <div class="field">
        <label class="field-label" for="lcSunset">Sunset</label>
        <input type="date" class="input" id="lcSunset" value="${esc(dateValue(c.Sunset))}" oninput="markDirty()">
      </div>
    </div>
    <p class="field-hint">Sent as Deprecation, Sunset and successor-version Link headers.</p>`, set);
}

function applyLifecycle(cfg) {
  const deprecated = document.getElementById('lcDeprecated')?.checked ?? false;
  const since = document.getElementById('lcDeprecatedSince')?.value;
  const sunset = document.getElementById('lcSunset')?.value;
  const stability = document.getElementById('lcStability')?.value;
  return {
    ...cfg,
    Stability: stability && stability !== 'Not set' ? stability : undefined,
    Badges: readBadges(),
    Deprecated: deprecated || undefined,
    DeprecatedSince: deprecated && since ? `${since}T00:00:00Z` : undefined,
    Sunset: sunset ? `${sunset}T00:00:00Z` : undefined
  };
}

function fieldBadges(badges) {
  return `<div class="field">
    <label class="field-label">Badges</label>
    <div class="kv-editor" id="badges">${(badges ?? []).map(badgeRow).join('')}</div>
    <button type="button" class="ep-add-row" onclick="document.getElementById('badges').insertAdjacentHTML('beforeend', badgeRow()); markDirty()">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add badge
    </button>
  </div>`;
}

function badgeRow(badge = {}) {
  const before = String(badge.Position ?? '').toLowerCase() === 'before';
  return `<div class="ep-kv-row ep-badge-row">
    <input type="text" class="input" data-badge="name" placeholder="Name" aria-label="Badge name" maxlength="32" value="${esc(badge.Name ?? '')}" oninput="markDirty()">
    <select class="input" data-badge="position" aria-label="Badge position" onchange="markDirty()">
      <option value="after" ${before ? '' : 'selected'}>After</option>
      <option value="before" ${before ? 'selected' : ''}>Before</option>
    </select>
    <input type="text" class="input" data-badge="color" placeholder="Color" aria-label="Badge color" value="${esc(badge.Color ?? '')}" oninput="markDirty()">
    <button type="button" class="btn btn-ghost btn-icon" onclick="this.closest('.ep-kv-row').remove(); markDirty()" title="Remove" aria-label="Remove badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>`;
}

function readBadges() {
  const badges = Array.from(document.querySelectorAll('#badges .ep-badge-row')).map(row => ({
    Name: row.querySelector('[data-badge="name"]').value.trim(),
    Position: row.querySelector('[data-badge="position"]').value === 'before' ? 'before' : undefined,
    Color: row.querySelector('[data-badge="color"]').value.trim() || undefined
  })).filter(badge => badge.Name || badge.Color);
  return badges.length ? badges : undefined;
}

function fieldText(id, label, value, placeholder = '', opts = {}) {
  const { type = 'text', required = false, min, max, hint } = opts;
  const attrs = [
    required ? 'aria-required="true"' : '',
    min != null ? `min="${min}"` : '',
    max != null ? `max="${max}"` : '',
    type === 'number' ? 'inputmode="numeric" step="1"' : '',
    hint ? `aria-describedby="${id}-hint"` : ''
  ].filter(Boolean).join(' ');
  return `<div class="field">
    <label class="field-label" for="${id}">${label}${required ? '<span class="field-required" aria-hidden="true">*</span>' : ''}</label>
    <input type="${type}" class="input" id="${id}" value="${esc(value ?? '')}" placeholder="${esc(placeholder)}" ${attrs} oninput="markDirty()">
    ${hint ? `<div class="field-help" id="${id}-hint">${esc(hint)}</div>` : ''}
  </div>`;
}

function folderNamespace() {
  const parts = (_selected?.name ?? '').split('/');
  if (parts.length > 1 && /^v\d+$/i.test(parts[parts.length - 1])) parts.pop();
  return parts.slice(0, -1).join('/');
}

function fieldNamespace(c) {
  const inferred = folderNamespace();
  return fieldText('namespace', 'Namespace', c.Namespace ?? '', inferred || 'e.g. Sales', { hint: inferred ? `Empty uses the folder namespace ${inferred}` : '' });
}

function fieldRow(...fields) {
  return `<div class="field-row">${fields.join('')}</div>`;
}

function fieldMetadata(c, open = false) {
  const set = !!(c.Namespace || c.NamespaceDisplayName || c.DisplayName);
  return accordion('Metadata', fieldRow(
    fieldNamespace(c),
    fieldText('namespaceDisplayName', 'Namespace Label', c.NamespaceDisplayName ?? '', 'e.g. Sales orders'),
    fieldText('displayName', 'Display Name', c.DisplayName ?? '', 'e.g. Order lines')
  ), open || set);
}

function fieldMcp(c) {
  return fieldToggle('isMcpExposed', 'Expose in MCP', c.Mcp?.Exposed === true);
}

function readMcp(c) {
  const on = document.getElementById('isMcpExposed')?.checked ?? false;
  if (c.Mcp) return on || c.Mcp.Exposed !== undefined ? { ...c.Mcp, Exposed: on } : c.Mcp;
  return on ? { Exposed: true } : undefined;
}

function fieldSelect(id, label, value, options) {
  const opts = options.map(o => `<option ${value === o ? 'selected' : ''}>${esc(o)}</option>`).join('');
  return `<div class="field">
    <label class="field-label" for="${id}">${label}</label>
    <select class="input" id="${id}" onchange="markDirty()">${opts}</select>
  </div>`;
}

function fieldMethods(selected, id = 'methodPicker') {
  const sel = [].concat(selected ?? ['GET']).map(m => String(m).toUpperCase());
  const all = [...new Set(['GET','POST','PUT','PATCH','MERGE','DELETE','QUERY', ...sel])];
  return `<div class="field">
    <span class="field-label" id="${id}-label">Methods<span class="field-required" aria-hidden="true">*</span></span>
    <div class="method-picker" id="${id}" role="group" aria-labelledby="${id}-label">
      ${all.map(m => `<button type="button" class="method-btn m-${m.toLowerCase()} ${sel.includes(m) ? 'active' : ''}" aria-pressed="${sel.includes(m)}" onclick="toggleMethod(this); markDirty()">${m}</button>`).join('')}
    </div>
  </div>`;
}

function toggleMethod(btn) {
  btn.setAttribute('aria-pressed', String(btn.classList.toggle('active')));
}

function fieldKV(id, label, obj) {
  const rows = Object.entries(obj ?? {}).map(([k, v]) => kvRow(k, v)).join('');
  return `<div class="field">
    <label class="field-label">${label}</label>
    <div class="kv-editor" id="${id}">${rows}</div>
    <button type="button" class="ep-add-row" onclick="addKvRow('${id}')">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add row
    </button>
  </div>`;
}

function fieldTextarea(id, label, value, minHeight = '80px', isCode = false) {
  return `<div class="field">
    <label class="field-label" for="${id}">${label}</label>
    <textarea id="${id}" class="input${isCode ? ' input-code' : ''}" style="min-height:${minHeight}" oninput="markDirty()">${esc(value ?? '')}</textarea>
  </div>`;
}

function readDocumentation(c) {
  const tag  = document.getElementById('docTagDescription')?.value?.trim() ?? '';
  const descsRaw = document.getElementById('docMethodDescriptions')?.value?.trim() ?? '';
  const docsRaw  = document.getElementById('docMethodDocumentation')?.value?.trim() ?? '';
  const existing = c?.Documentation ?? {};
  let descs = null, docs = null;
  try { descs = descsRaw ? JSON.parse(descsRaw) : null; } catch { descs = existing.MethodDescriptions ?? null; }
  try { docs = docsRaw ? JSON.parse(docsRaw) : null; } catch { docs = existing.MethodDocumentation ?? null; }
  const doc = { ...existing };
  for (const [key, value] of [['TagDescription', tag], ['MethodDescriptions', descs], ['MethodDocumentation', docs]]) {
    if (value) doc[key] = value;
    else delete doc[key];
  }
  return Object.keys(doc).length ? doc : null;
}

function kvRow(k = '', v = '', keyLabel = 'Key', valueLabel = 'Value') {
  return `<div class="ep-kv-row">
    <input type="text" class="input" placeholder="${esc(keyLabel)}" aria-label="${esc(keyLabel)}" value="${esc(k)}" oninput="markDirty()">
    <input type="text" class="input" placeholder="${esc(valueLabel)}" aria-label="${esc(valueLabel)}" value="${esc(v)}" oninput="markDirty()">
    <button type="button" class="btn btn-ghost btn-icon" onclick="this.closest('.ep-kv-row').remove(); markDirty()" title="Remove">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>`;
}

function addKvRow(id, keyLabel, valueLabel) {
  document.getElementById(id)?.insertAdjacentHTML('beforeend', kvRow('', '', keyLabel, valueLabel));
}

function fieldTenancy(tenancy, valueLabel) {
  const rows = Object.entries(tenancy ?? {}).map(([k, v]) => kvRow(k, v, 'Header', valueLabel)).join('');
  return `<div class="field">
    <label class="field-label" id="tenancyLabel">Tenant headers</label>
    <div class="ep-col-list" id="tenancy" role="group" aria-labelledby="tenancyLabel">${rows}</div>
    <button type="button" class="ep-add-row" onclick="addKvRow('tenancy', 'Header', '${esc(valueLabel)}'); markDirty()">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add tenant header
    </button>
    <div class="field-help">Requests must use a value the token allows for each header.</div>
  </div>`;
}

function fieldFileTenancy(tenancy) {
  return `<div class="field">
    <label class="field-label" for="tenancyHeaders">Tenant headers</label>
    <input type="text" class="input" id="tenancyHeaders" placeholder="X-Company-Id" value="${esc(Object.keys(tenancy ?? {}).join(', '))}" oninput="markDirty()">
    <div class="field-help">Comma separated. Each header needs a placeholder in Base Directory, e.g. <code>invoices/{X-Company-Id}</code>.</div>
  </div>`;
}

function readTenancy() {
  const fileHeaders = document.getElementById('tenancyHeaders');
  const tenancy = fileHeaders
    ? Object.fromEntries(fileHeaders.value.split(',').map(h => h.trim()).filter(Boolean).map(h => [h, '']))
    : readKV('tenancy');
  return Object.keys(tenancy).length ? tenancy : undefined;
}

function readKV(id) {
  const obj = {};
  document.querySelectorAll(`#${id} .ep-kv-row`).forEach(row => {
    const [kInput, vInput] = row.querySelectorAll('input');
    if (kInput?.value?.trim()) obj[kInput.value.trim()] = vInput?.value ?? '';
  });
  return obj;
}

function fieldColumns(id, label, arr, addLabel = 'Add column', placeholder = 'ColumnName', required = false) {
  const rows = (arr ?? []).map(col => colRow(col, placeholder, label)).join('');
  return `<div class="field">
    <span class="field-label" id="${id}-label">${label}${required ? '<span class="field-required" aria-hidden="true">*</span>' : ''}</span>
    <div class="ep-col-list" id="${id}" role="group" aria-labelledby="${id}-label">${rows}</div>
    <button type="button" class="ep-add-row" onclick="addColRow('${id}', '${placeholder}', '${esc(label)}')">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      ${addLabel}
    </button>
  </div>`;
}

function colRow(val = '', placeholder = 'ColumnName', label = 'Value') {
  return `<div class="ep-col-row">
    <input type="text" class="input" placeholder="${esc(placeholder)}" value="${esc(val)}" aria-label="${esc(label)}" spellcheck="false" oninput="markDirty()">
    <button type="button" class="btn btn-ghost btn-icon" onclick="this.closest('.ep-col-row').remove(); markDirty()" title="Remove" aria-label="Remove ${esc(label)} ${esc(val)}">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>`;
}

function addColRow(id, placeholder, label) {
  const list = document.getElementById(id);
  list?.insertAdjacentHTML('beforeend', colRow('', placeholder, label));
  list?.lastElementChild?.querySelector('input')?.focus();
}

function readCacheProperties(existing) {
  const props = { ...(existing ?? {}) };
  delete props.CacheEnabled;
  delete props.CacheDurationMinutes;
  delete props.CacheInvalidatedBy;
  if (!document.getElementById('cacheEnabled')?.checked) props.CacheEnabled = false;
  else if (existing?.CacheEnabled !== undefined) props.CacheEnabled = true;
  const minutes = Number.parseInt(document.getElementById('cacheDurationMinutes')?.value ?? '', 10);
  if (Number.isInteger(minutes) && minutes > 0) props.CacheDurationMinutes = minutes;
  const tables = readColumns('cacheInvalidatedBy');
  if (tables.length) props.CacheInvalidatedBy = tables;
  return Object.keys(props).length ? props : undefined;
}

function readColumns(id) {
  return Array.from(document.querySelectorAll(`#${id} .ep-col-row input`))
    .map(i => i.value.trim()).filter(Boolean);
}

function readMethods(id = 'methodPicker') {
  return Array.from(document.querySelectorAll(`#${id} .method-btn.active`)).map(b => b.textContent.trim());
}

function fieldToggle(id, label, checked) {
  return `<div class="toggle-row">
    <label class="switch">
      <input type="checkbox" id="${id}" ${checked ? 'checked' : ''} onchange="markDirty()">
      <span class="slider"></span>
    </label>
    <label for="${id}">${esc(label)}</label>
  </div>`;
}

function fieldAllowedEnvs(value) {
  const list = (Array.isArray(value) ? value : String(value ?? '*').split(',')).map(v => String(v).trim()).filter(v => v && v !== '*');
  const all = !list.length;
  const names = [...new Set([..._allowedEnvs, ...list])];
  const option = (env, checked, extra = '') => `<label class="env-option"><input type="checkbox" data-env="${esc(env)}" ${checked ? 'checked' : ''} ${extra} onchange="envChanged(this)"><span>${env === '*' ? 'All allowed' : esc(env)}</span>${env !== '*' && !_allowedEnvs.includes(env) ? '<span class="env-flag">not in the global allowlist</span>' : ''}</label>`;
  return `<div class="field">
    <span class="field-label" id="allowedEnvironments-label">Environments</span>
    <div class="env-picker" id="allowedEnvironments" role="group" aria-labelledby="allowedEnvironments-label">
      ${option('*', all)}${names.map(env => option(env, list.includes(env), all ? 'disabled' : '')).join('')}
    </div>
  </div>`;
}

function envChanged(input) {
  if (input.dataset.env === '*') {
    input.closest('.env-picker').querySelectorAll('input:not([data-env="*"])').forEach(box => { box.disabled = input.checked; });
  }
  markDirty();
}

function fieldJson(id, label, value, minHeight = '100px') {
  const str = value != null ? JSON.stringify(value, null, 2) : '';
  const badgeLabel = label.replace(/\s*\(JSON(?:,\s*([^)]*))?\)/, (_, extra) =>
    ` <code class="field-json-badge">JSON</code>${extra ? ` <span class="field-label-hint">${extra.trim()}</span>` : ''}`
  );
  return fieldTextarea(id, badgeLabel, str, minHeight, true);
}

function fieldExampleIcon(fnName) {
  return `<span class="field-example-icon" onmouseenter="Tooltip.show(this,${fnName}(),{side:'right'})" onmouseleave="Tooltip.hide()"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></span>`;
}

function deletePatternsExample() {
  const row = (code) => `<code style="display:block;background:hsl(0 0% 10%/0.5);padding:0.15rem 0.4rem;border-radius:3px;margin-bottom:0.2rem;font-size:0.68rem">${code}</code>`;

function readJsonField(id) {
  const val = document.getElementById(id)?.value?.trim();
  if (!val) return undefined;
  try { return JSON.parse(val); } catch { return undefined; }

const WEBHOOK_PRESETS = ['GitHub', 'Stripe', 'Slack', 'Shopify', 'Jira', 'Mollie', 'ShipHero', 'StandardWebhooks'];
const WEBHOOK_MODES = ['None', ...WEBHOOK_PRESETS, 'SharedSecret', 'Hmac'];
const WEBHOOK_MODE_LABELS = { None: 'Portway token', SharedSecret: 'Shared secret', Hmac: 'HMAC signature', StandardWebhooks: 'Standard Webhooks' };
const HMAC_FIELDS = [
  ['Header', 'Signature header', 'e.g. X-Signature'], ['Prefix', 'Prefix', 'e.g. sha256='], ['SignedContent', 'Signed content', '{body}'],
  ['TimestampHeader', 'Timestamp header', 'e.g. X-Timestamp'], ['IdHeader', 'ID header', 'e.g. X-Request-Id'], ['ToleranceSeconds', 'Tolerance (s)', '300']
];
const HMAC_SELECTS = [['Encoding', 'Encoding', ['Hex', 'Base64']], ['KeyEncoding', 'Key encoding', ['Utf8', 'Base64']], ['Format', 'Format', ['Plain', 'TimestampList']]];
const DELIVERY_FIELDS = [['DeliveryIdHeader', 'Delivery ID header', 'e.g. X-Delivery-Id'], ['DeliveryIdField', 'Delivery ID field', 'e.g. id']];

function modeOptions(mode) {
  const option = m => `<option value="${m}" ${m === mode ? 'selected' : ''}>${esc(WEBHOOK_MODE_LABELS[m] ?? m)}</option>`;
  return `<optgroup label="Generic">${['None', 'SharedSecret', 'Hmac'].map(option).join('')}</optgroup>
    <optgroup label="Presets">${WEBHOOK_PRESETS.map(option).join('')}</optgroup>`;
}

function presetInfo(mode) {
  const p = _webhookPresets[mode];
  if (!p) return '';
  const parts = [];
  if (p.header) parts.push(`signature <code>${esc(p.header)}</code>`);
  else if (mode === 'StandardWebhooks') parts.push('signature <code>webhook-signature</code>');
  if (p.timestamp_header) parts.push(`timestamp <code>${esc(p.timestamp_header)}</code>`);
  if (p.delivery_id_header) parts.push(`delivery ID <code>${esc(p.delivery_id_header)}</code>`);
  else if (p.delivery_id_field) parts.push(`delivery ID field <code>${esc(p.delivery_id_field)}</code>`);
  return parts.length ? `Reads ${parts.join(', ')}` : '';
}

function modeChanged(select) {
  const row = select.closest('.wh-verify-row');
  row.dataset.mode = select.value;
  const info = row.querySelector('.wh-preset-info');
  if (info) info.innerHTML = presetInfo(select.value);
  markDirty();
}

function secretRefName(value) {
  const m = /^\$\{secret:([A-Za-z0-9-]{1,64})\}$/.exec(value ?? '');
  return m ? m[1] : '';
}

function verifyRow(id, v) {
  v = v ?? {};
  const mode = v.Scheme ? (WEBHOOK_MODES.find(m => m.toLowerCase() === v.Scheme.toLowerCase()) ?? v.Scheme) : 'None';
  const shared = mode === 'SharedSecret';
  const input = (key, label, placeholder, value, extra = '') => `<label class="wh-field"><span>${esc(label)}</span>
      <input type="${key === 'ToleranceSeconds' ? 'number' : 'text'}" class="input" data-key="${key}" value="${esc(value ?? '')}" placeholder="${esc(placeholder)}" spellcheck="false" ${extra} oninput="markDirty()"></label>`;
  const select = (key, label, options) => `<label class="wh-field"><span>${esc(label)}</span>
      <select class="input" data-key="${key}" onchange="markDirty()">${options.map(o => `<option ${(v[key] ?? options[0]) === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></label>`;
  const secret = (key, label) => `<label class="wh-field"><span>${esc(label)}</span>
      <input type="text" class="input wh-secret" data-key="${key}" list="secretNames" value="${esc(secretRefName(v[key]))}" placeholder="SECRET-NAME" spellcheck="false" autocomplete="off" oninput="markDirty()"></label>`;
  const toggle = (key, label) => `<label class="wh-toggle"><span class="switch"><input type="checkbox" data-key="${key}" ${v[key] ? 'checked' : ''} onchange="markDirty()"><span class="slider"></span></span>${esc(label)}</label>`;
  const hmacValue = key => {
    if (key === 'Header') return shared ? '' : v.Header;
    if (key === 'SignedContent') return v.SignedContent ?? '{body}';
    return v[key];
  };
  const extra = key => key === 'ToleranceSeconds' ? 'min="60" max="900" step="1"' : '';
  return `<div class="wh-verify-row" data-id="${esc(id)}" data-mode="${esc(mode)}">
    <div class="wh-verify-head">
      <span class="wh-id">${esc(id)}</span>
      <select class="input wh-mode" aria-label="Verification for ${esc(id)}" onchange="modeChanged(this)">${modeOptions(mode)}</select>
    </div>
    <div class="wh-verify-body">
      <div class="wh-preset-info">${presetInfo(mode)}</div>
      <div class="wh-grid">${secret('Secret', 'Secret')}${secret('PreviousSecret', 'Previous secret')}</div>
      <div class="wh-grid wh-only-shared">${input('SharedHeader', 'Credential header', 'e.g. X-Hook-Key', v.SharedHeader ?? (shared ? v.Header : ''))}${input('Username', 'Basic username', 'e.g. sender', v.Username)}</div>
      <div class="wh-grid wh-only-hmac">${HMAC_FIELDS.map(([key, label, placeholder]) => input(key, label, placeholder, hmacValue(key), extra(key))).join('')}${HMAC_SELECTS.map(f => select(...f)).join('')}</div>
      <div class="wh-grid wh-only-custom">${DELIVERY_FIELDS.map(([key, label, placeholder]) => input(key, label, placeholder, v[key])).join('')}${select('DedupeKey', 'Dedupe key', ['DeliveryId', 'BodyHash'])}</div>
      <div class="wh-toggles">${toggle('Deduplicate', 'Deduplicate')}${toggle('AcceptForm', 'Accept form bodies')}</div>
      <div class="field-help">Deduplicate needs a <code>DeliveryId</code> column with a unique index.</div>
    </div>
  </div>`;
}

function renderVerificationRows(ids, verification) {
  if (!ids.length) return `<div class="secret-empty">Add a webhook ID to choose its verification.</div><datalist id="secretNames"></datalist>`;
  const byId = Object.fromEntries(Object.entries(verification).map(([k, v]) => [k.toLowerCase(), v]));
  return ids.map(id => verifyRow(id, byId[id.toLowerCase()])).join('') + `<datalist id="secretNames"></datalist>`;
}

function syncVerificationRows() {
  const list = document.getElementById('verificationList');
  if (!list) return;
  const ids = readColumns('allowedCols');
  const rows = [...list.querySelectorAll('.wh-verify-row')].map(r => r.dataset.id);
  if (ids.join('\n').toLowerCase() === rows.join('\n').toLowerCase()) return;
  const current = collectVerification(true);
  list.innerHTML = renderVerificationRows(ids, current);
  loadSecretNames();
}

async function loadSecretNames() {
  const list = document.getElementById('secretNames');
  if (!list) return;
  const envs = readEnvs() ?? (await api('/_/api/environments', { silent: true }).catch(() => ({}))).allowed_environments ?? [];
  const names = new Set();
  await Promise.all(envs.map(async env => {
    try { (await api(`/_/api/environments/${encodeURIComponent(env)}`, { silent: true })).secret_names?.forEach(n => names.add(n)); } catch (e) {}
  }));
  list.innerHTML = [...names].sort().map(n => `<option value="${esc(n)}"></option>`).join('');
}

function collectVerification(keepAll = false) {
  const result = {};
  document.querySelectorAll('#verificationList .wh-verify-row').forEach(row => {
    const mode = row.querySelector('.wh-mode').value;
    if (mode === 'None' && !keepAll) return;
    const read = key => row.querySelector(`[data-key="${key}"]`);
    const text = key => read(key)?.value?.trim() || undefined;
    const secretRef = key => (text(key) ? '${secret:' + text(key) + '}' : undefined);
    const saved = Object.entries(_detailData?.content?.Verification ?? {}).find(([k]) => k.toLowerCase() === row.dataset.id.toLowerCase())?.[1] ?? {};
    const choice = (key, fallback) => (keepAll || saved[key] !== undefined || text(key) !== fallback ? text(key) : undefined);
    const v = {
      Scheme: mode === 'None' ? undefined : mode,
      Secret: secretRef('Secret'),
      PreviousSecret: secretRef('PreviousSecret'),
      Deduplicate: read('Deduplicate')?.checked || undefined,
      AcceptForm: read('AcceptForm')?.checked || undefined
    };
    if (mode === 'SharedSecret') Object.assign(v, { Header: text('SharedHeader'), Username: text('Username') });
    if (keepAll) v.SharedHeader = text('SharedHeader');
    if (mode === 'Hmac' || keepAll) {
      HMAC_FIELDS.forEach(([key]) => { v[key] ??= text(key); });
      HMAC_SELECTS.forEach(([key, , options]) => { v[key] = key === 'Encoding' ? text(key) : choice(key, options[0]); });
      if (v.ToleranceSeconds) v.ToleranceSeconds = Number.parseInt(v.ToleranceSeconds, 10);
    }
    if (mode === 'Hmac' || mode === 'SharedSecret' || keepAll) {
      DELIVERY_FIELDS.forEach(([key]) => { v[key] = text(key); });
      v.DedupeKey = choice('DedupeKey', 'DeliveryId');
    }
    if (keepAll && mode !== 'SharedSecret') v.Username = text('Username');
    result[row.dataset.id] = JSON.parse(JSON.stringify(v));
  });
  return result;
}

function wireWebhookForm() {
  const ids = document.getElementById('allowedCols');
  if (!ids) return;
  ids.addEventListener('focusout', syncVerificationRows);
  new MutationObserver(records => {
    if (records.some(r => [...r.addedNodes, ...r.removedNodes].some(n => n.classList?.contains('ep-col-row')))) syncVerificationRows();
  }).observe(ids, { childList: true });
  document.getElementById('allowedEnvironments')?.addEventListener('change', loadSecretNames);
  loadSecretNames();
  loadWebhookPresets();
}

  }
  document.querySelectorAll('#verificationList .wh-verify-row').forEach(row => {
    const info = row.querySelector('.wh-preset-info');
    if (info) info.innerHTML = presetInfo(row.dataset.mode);
  });
}

const WEBHOOK_ID = /^[^\s\/\\()'"?#%]+$/;
const HEADER_NAME = /^[A-Za-z0-9!#$%&'*+\-.^_`|~]+$/;

function validateWebhookIds(errors, listId) {
  const inputs = [...document.querySelectorAll(`#${listId} .ep-col-row input`)];
  const seen = new Set();
  for (const input of inputs) {
    const id = input.value.trim();
    if (!id) continue;
    if (!WEBHOOK_ID.test(id)) errors.push(fieldError(input, 'An ID cannot contain spaces, slashes, quotes, brackets, ? # or %'));
    else if (seen.has(id.toLowerCase())) errors.push(fieldError(input, 'This ID is listed twice'));
    seen.add(id.toLowerCase());
  }
  if (!seen.size) errors.push(fieldError(inputs[0] ?? document.getElementById(listId), 'Add at least one webhook ID'));
}

function validateVerification(errors) {
  document.querySelectorAll('#verificationList .wh-verify-row').forEach(row => {
    const mode = row.querySelector('.wh-mode').value;
    if (mode === 'None') return;
    const el = key => row.querySelector(`[data-key="${key}"]`);
    const val = key => el(key)?.value?.trim() ?? '';
    const add = (key, message) => errors.push(fieldError(el(key) ?? row.querySelector('.wh-mode'), message));
    for (const key of ['Secret', 'PreviousSecret']) {
      const name = val(key);
      if ((key === 'Secret' || name) && !/^[A-Za-z0-9-]{1,64}$/.test(name)) add(key, key === 'Secret' ? 'Pick a secret name' : 'Use a secret name: letters, numbers and hyphens');
    }
    const custom = mode === 'Hmac' || mode === 'SharedSecret';
    for (const key of ['SharedHeader', 'Header', 'TimestampHeader', 'IdHeader', 'DeliveryIdHeader']) {
      const visible = key === 'SharedHeader' ? mode === 'SharedSecret' : key === 'DeliveryIdHeader' ? custom : mode === 'Hmac';
      if (visible && val(key) && !HEADER_NAME.test(val(key))) add(key, 'Use a valid header name, for example X-Signature');
    }
    if (mode === 'SharedSecret') {
      if (!val('SharedHeader') && !val('Username')) add('SharedHeader', 'Set a credential header or a Basic username');
      if (val('SharedHeader') && val('Username')) add('Username', 'Use a credential header or a Basic username, not both');
    }
    if (mode === 'Hmac') {
      if (!val('Header')) add('Header', 'Signature header is required');
      const content = val('SignedContent');
      const count = token => content.split(token).length - 1;
      const timestampList = val('Format') === 'TimestampList';
      if (count('{body}') !== 1) add('SignedContent', 'Signed content must contain {body} once');
      else if ((content.match(/\{[^}]*\}/g) ?? []).some(t => !['{body}', '{timestamp}', '{id}'].includes(t))) add('SignedContent', 'Signed content accepts {body}, {timestamp} and {id} only');
      if (timestampList && !count('{timestamp}')) add('SignedContent', 'Format TimestampList needs {timestamp} in signed content');
      if (timestampList && val('TimestampHeader')) add('TimestampHeader', 'Format TimestampList reads the timestamp from the signature header');
      if (count('{timestamp}') && !val('TimestampHeader') && !timestampList) add('TimestampHeader', 'Set the header that sends {timestamp}');
      if (val('TimestampHeader') && !count('{timestamp}')) add('SignedContent', 'Add {timestamp} or clear Timestamp header');
      if (count('{id}') && !val('IdHeader')) add('IdHeader', 'Set the header that sends {id}');
      if (val('IdHeader') && !count('{id}')) add('SignedContent', 'Add {id} or clear ID header');
      const tolerance = val('ToleranceSeconds');
      if (tolerance && !(/^\d+$/.test(tolerance) && +tolerance >= 60 && +tolerance <= 900)) add('ToleranceSeconds', 'Use 60 to 900 seconds');
    }
    if (custom) {
      if (mode === 'Hmac' && val('DeliveryIdHeader') && val('DeliveryIdField')) add('DeliveryIdField', 'Use a delivery ID header or field, not both');
      const source = val('DeliveryIdHeader') || val('DeliveryIdField') || val('DedupeKey') === 'BodyHash';
      if (el('Deduplicate')?.checked && !source) add('DeliveryIdHeader', 'Deduplicate needs a delivery ID header, field or the BodyHash key');
    }
    if (el('AcceptForm')?.checked && document.getElementById('hidden')?.checked) add('AcceptForm', 'Accept form bodies is not allowed on a hidden webhook');
  });
}

function readEnvs() {
  const picker = document.getElementById('allowedEnvironments');
  if (!picker || picker.querySelector('[data-env="*"]')?.checked) return undefined;
  return [...picker.querySelectorAll('input:checked')].map(box => box.dataset.env);
}

function validateEnvs(errors) {
  const envs = readEnvs();
  if (envs && !envs.length) errors.push(fieldError('allowedEnvironments', 'Select an environment or All allowed'));
}

function fieldError(target, message) {
  return { target, message };
}

const JSON_FIELDS = [
  ['docMethodDescriptions', 'Method Descriptions'], ['docMethodDocumentation', 'Method Documentation'],
  ['columnValidation', 'Column Validation'], ['functionParameters', 'Function Parameters'],
  ['deletePatterns', 'Delete Patterns'], ['compositeSteps', 'Steps'], ['createSteps', 'Steps']
];

function validateDocFields(errors) {
  for (const [id, label] of JSON_FIELDS) {
    const raw = document.getElementById(id)?.value?.trim() ?? '';
    if (raw) { try { JSON.parse(raw); } catch { errors.push(fieldError(id, `${label} must be valid JSON`)); } }
  }
}

function requireText(errors, id, message) {
  if (!document.getElementById(id)?.value?.trim()) errors.push(fieldError(id, message));
}

function clearFieldError(el) {
  el.removeAttribute('aria-invalid');
  const id = el.getAttribute('aria-describedby')?.split(' ').find(x => x.endsWith('-error'));
  if (id) {
    document.getElementById(id)?.remove();
    const rest = el.getAttribute('aria-describedby').split(' ').filter(x => x !== id).join(' ');
    rest ? el.setAttribute('aria-describedby', rest) : el.removeAttribute('aria-describedby');
  }
}

let _errorSeq = 0;
function showFieldErrors(errors) {
  document.querySelectorAll('[aria-invalid="true"]').forEach(clearFieldError);
  document.querySelectorAll('.field-error').forEach(e => e.remove());
  const loose = [];
  let first = null;
  for (const { target, message } of errors) {
    const el = typeof target === 'string' ? document.getElementById(target) : target;
    if (!el) { loose.push(message); continue; }
    const msg = document.createElement('div');
    msg.className = 'field-error';
    msg.id = `fe${++_errorSeq}-error`;
    msg.textContent = message;
    const cell = el.closest('.wh-field');
    if (cell) cell.append(msg);
    else (el.closest('.ep-col-row, .wh-verify-head') ?? el).after(msg);
    el.setAttribute('aria-invalid', 'true');
    el.setAttribute('aria-describedby', [el.getAttribute('aria-describedby'), msg.id].filter(Boolean).join(' '));
    first ??= el;
  }
  if (first) {
    first.closest('.accordion')?.classList.add('open');
    first.scrollIntoView({ block: 'center' });
    first.focus({ preventScroll: true });
  }
  const marked = errors.length - loose.length;
  const summary = marked === 1 && !loose.length ? errors[0].message : marked ? `${marked} fields need attention` : '';
  for (const message of [summary, ...loose].filter(Boolean)) toast(message, 'error');
}

document.addEventListener('input', e => { if (e.target.getAttribute?.('aria-invalid') === 'true') clearFieldError(e.target); });
document.addEventListener('change', e => {
  const el = e.target.closest?.('[aria-invalid="true"]') ?? e.target.closest?.('.env-picker, .method-picker');
  if (el?.getAttribute('aria-invalid') === 'true') clearFieldError(el);
});

const SERVER_FIELDS = [
  ['DatabaseObjectName', ['objectName', 'createObjectName']], ['Url', ['url', 'createUrl']], ['Namespace', ['namespace', 'createNamespace']],
  ['AllowedColumns', ['allowedCols', 'createWebhookIds']], ['Tenancy', ['tenancy', 'tenancyHeaders']], ['Badges', ['badges']], ['Stability', ['lcStability', 'lcDeprecated']]
];

function serverErrorTarget(message) {
  const id = /^Verification\.([^:]+):/.exec(message)?.[1];
  if (id) return [...document.querySelectorAll('#verificationList .wh-verify-row')].find(r => r.dataset.id.toLowerCase() === id.toLowerCase())?.querySelector('.wh-mode') ?? null;
  const hit = SERVER_FIELDS.find(([key]) => message.includes(key));
  return hit?.[1].map(x => document.getElementById(x)).find(Boolean) ?? null;
}

function showServerErrors(err) {
  if (err?.errors?.length) showFieldErrors(err.errors.map(m => fieldError(serverErrorTarget(m), m)));
  else toast(err?.message || 'Save failed', 'error');
}

function validateForm(type) {
  const methods = readMethods();
  const errors = [];
  const needMethods = () => { if (!methods.length) errors.push(fieldError('methodPicker', 'Select at least one method')); };

  switch(type) {
    case 'sql': {
      requireText(errors, 'objectName', 'Object Name is required');
      const minutes = document.getElementById('cacheDurationMinutes')?.value?.trim() ?? '';
      if (minutes && !/^[1-9]\d*$/.test(minutes)) errors.push(fieldError('cacheDurationMinutes', 'Duration must be a whole number of minutes'));
      needMethods();
      break;
    }
    case 'proxy':
      requireText(errors, 'url', 'URL is required');
      needMethods();
      break;
    case 'composite':
      requireText(errors, 'url', 'URL is required');
      needMethods();
      break;
    case 'file':
      requireText(errors, 'baseDirectory', 'Base Directory is required');
      break;
    case 'static':
      requireText(errors, 'contentFile', 'Content File is required');
      requireText(errors, 'contentType', 'Content-Type is required');
      break;
    case 'webhook':
      validateWebhookIds(errors, 'allowedCols');
      validateVerification(errors);
      requireText(errors, 'objectName', 'Object Name is required');
      break;
  }
  validateEnvs(errors);
  validateDocFields(errors);
  return errors;
}

// Form to JSON over the existing content so hidden fields are kept
function keepDefault(c, key, value, fallback) {
  return c[key] === undefined && JSON.stringify(value) === JSON.stringify(fallback) ? undefined : value;
}

function collectFormConfig(type, existingContent) {
  const c = existingContent ?? {};
  const methods = readMethods();
  const envs = readEnvs();

  switch(type) {
    case 'sql': {
      const cols     = readColumns('allowedCols');
      const reqCols  = readColumns('requiredCols');
      const doc      = readDocumentation(c);
      return {
        ...c,
        DatabaseSchema:       document.getElementById('schema')?.value?.trim() || undefined,
        DatabaseObjectName:   document.getElementById('objectName')?.value?.trim() ?? '',
        DatabaseObjectType:   keepDefault(c, 'DatabaseObjectType', document.getElementById('objectType')?.value ?? 'Table', 'Table'),
        Namespace:            document.getElementById('namespace')?.value?.trim() || undefined,
        NamespaceDisplayName: document.getElementById('namespaceDisplayName')?.value?.trim() || undefined,
        NamespaceDescription: document.getElementById('namespaceDescription')?.value?.trim() || undefined,
        DisplayName:          document.getElementById('displayName')?.value?.trim() || undefined,
        Hidden:            keepDefault(c, 'Hidden', document.getElementById('hidden')?.checked ?? false, false),
        Enabled:           keepDefault(c, 'Enabled', document.getElementById('enabled')?.checked ?? true, true),
        IsMcpExposed:         undefined,
        Mcp:                  readMcp(c),
        AllowedEnvironments:  envs,
        AllowedMethods:       keepDefault(c, 'AllowedMethods', methods, ['GET']),
        Procedure:            document.getElementById('procedure')?.value?.trim() || undefined,
        PrimaryKey:           document.getElementById('primaryKey')?.value?.trim() || undefined,
        AllowedColumns:       cols.length ? cols : undefined,
        RequiredColumns:      reqCols.length ? reqCols : undefined,
        ColumnValidation:     readJsonField('columnValidation'),
        FunctionParameters:   readJsonField('functionParameters'),
        Tenancy:              readTenancy(),
        Properties:           readCacheProperties(c.Properties),
        Documentation:        doc ?? undefined,
      };
    }
    case 'proxy': {
      const doc = readDocumentation(c);
      const cpContentType         = document.getElementById('cpContentType')?.value?.trim() || undefined;
      const cpMethodTranslation   = document.getElementById('cpHttpMethodTranslation')?.value?.trim() || undefined;
      const cpMethodAppendHeaders = document.getElementById('cpHttpMethodAppendHeaders')?.value?.trim() || undefined;
      const customProps = (cpContentType || cpMethodTranslation || cpMethodAppendHeaders) ? {
        ...(cpContentType         ? { ContentType: cpContentType }                         : {}),
        ...(cpMethodTranslation   ? { HttpMethodTranslation: cpMethodTranslation }         : {}),
        ...(cpMethodAppendHeaders ? { HttpMethodAppendHeaders: cpMethodAppendHeaders }     : {}),
      } : undefined;
      return {
        ...c,
        Url:                  document.getElementById('url')?.value?.trim() ?? '',
        Methods:              methods,
        Namespace:            document.getElementById('namespace')?.value?.trim() || undefined,
        NamespaceDisplayName: document.getElementById('namespaceDisplayName')?.value?.trim() || undefined,
        NamespaceDescription: document.getElementById('namespaceDescription')?.value?.trim() || undefined,
        DisplayName:          document.getElementById('displayName')?.value?.trim() || undefined,
        AllowedEnvironments:  envs,
        Hidden:            keepDefault(c, 'Hidden', document.getElementById('hidden')?.checked ?? false, false),
        Enabled:           keepDefault(c, 'Enabled', document.getElementById('enabled')?.checked ?? true, true),
        IsMcpExposed:         undefined,
        Mcp:                  readMcp(c),
        DeletePatterns:       readJsonField('deletePatterns'),
        CustomProperties:     customProps,
        Tenancy:              readTenancy(),
        Documentation:        doc ?? undefined,
      };
    }
    case 'composite': {
      const doc   = readDocumentation(c);
      const steps = readJsonField('compositeSteps') ?? [];
      return {
        ...c,
        Type:                 'Composite',
        Url:                  document.getElementById('url')?.value?.trim() ?? '',
        Methods:              methods,
        Namespace:            document.getElementById('namespace')?.value?.trim() || undefined,
        NamespaceDisplayName: document.getElementById('namespaceDisplayName')?.value?.trim() || undefined,
        NamespaceDescription: document.getElementById('namespaceDescription')?.value?.trim() || undefined,
        DisplayName:          document.getElementById('displayName')?.value?.trim() || undefined,
        AllowedEnvironments:  envs,
        Hidden:            keepDefault(c, 'Hidden', document.getElementById('hidden')?.checked ?? false, false),
        Enabled:           keepDefault(c, 'Enabled', document.getElementById('enabled')?.checked ?? true, true),
        IsMcpExposed:         undefined,
        Mcp:                  readMcp(c),
        CompositeConfig: {
          ...c.CompositeConfig,
          Name:        document.getElementById('compositeConfigName')?.value?.trim() || undefined,
          Description: document.getElementById('compositeConfigDesc')?.value?.trim() || undefined,
          Steps:       steps,
        },
        Documentation: doc ?? undefined,
      };
    }
    case 'file': {
      const exts = (document.getElementById('allowedExtensions')?.value ?? '').split(',').map(s=>s.trim()).filter(Boolean);
      const doc  = readDocumentation(c);
      return {
        ...c,
        StorageType:          document.getElementById('storageType')?.value ?? 'Local',
        BaseDirectory:        document.getElementById('baseDirectory')?.value?.trim() ?? '',
        AllowedExtensions:    exts,
        Tenancy:              readTenancy(),
        Namespace:            document.getElementById('namespace')?.value?.trim() || undefined,
        NamespaceDisplayName: document.getElementById('namespaceDisplayName')?.value?.trim() || undefined,
        NamespaceDescription: document.getElementById('namespaceDescription')?.value?.trim() || undefined,
        DisplayName:          document.getElementById('displayName')?.value?.trim() || undefined,
        AllowedEnvironments:  envs,
        Hidden:            keepDefault(c, 'Hidden', document.getElementById('hidden')?.checked ?? false, false),
        Enabled:           keepDefault(c, 'Enabled', document.getElementById('enabled')?.checked ?? true, true),
        IsMcpExposed:         undefined,
        Mcp:                  readMcp(c),
        Documentation:        doc ?? undefined,
      };
    }
    case 'static': {
      const doc = readDocumentation(c);
      return {
        ...c,
        ContentType:          document.getElementById('contentType')?.value?.trim() ?? 'application/json',
        ContentFile:          document.getElementById('contentFile')?.value?.trim() ?? '',
        EnableFiltering:      document.getElementById('enableFiltering')?.checked ?? false,
        Namespace:            document.getElementById('namespace')?.value?.trim() || undefined,
        NamespaceDisplayName: document.getElementById('namespaceDisplayName')?.value?.trim() || undefined,
        NamespaceDescription: document.getElementById('namespaceDescription')?.value?.trim() || undefined,
        DisplayName:          document.getElementById('displayName')?.value?.trim() || undefined,
        AllowedEnvironments:  envs,
        Hidden:            keepDefault(c, 'Hidden', document.getElementById('hidden')?.checked ?? false, false),
        Enabled:           keepDefault(c, 'Enabled', document.getElementById('enabled')?.checked ?? true, true),
        IsMcpExposed:         undefined,
        Mcp:                  readMcp(c),
        Documentation:        doc ?? undefined,
      };
    }
    case 'webhook': {
      const cols    = readColumns('allowedCols');
      const verification = collectVerification();
      const doc     = readDocumentation(c);
      return {
        ...c,
        DatabaseObjectName:   document.getElementById('objectName')?.value?.trim() ?? '',
        DatabaseSchema:       document.getElementById('schema')?.value?.trim() || undefined,
        AllowedColumns:       cols.length ? cols : undefined,
        AllowedEnvironments:  envs,
        Namespace:            document.getElementById('namespace')?.value?.trim() || undefined,
        NamespaceDisplayName: document.getElementById('namespaceDisplayName')?.value?.trim() || undefined,
        NamespaceDescription: document.getElementById('namespaceDescription')?.value?.trim() || undefined,
        DisplayName:          document.getElementById('displayName')?.value?.trim() || undefined,
        Hidden:            keepDefault(c, 'Hidden', document.getElementById('hidden')?.checked ?? false, false),
        Enabled:           keepDefault(c, 'Enabled', document.getElementById('enabled')?.checked ?? true, true),
        IsMcpExposed:         undefined,
        Mcp:                  readMcp(c),
        Verification:         Object.keys(verification).length ? verification : undefined,
        Documentation:        doc ?? undefined,
      };
    }
  }
  return {};
}

async function saveEndpoint() {
  if (!_selected || !_detailData) return;
  const { type, name } = _selected;
  const saveBtn = document.getElementById('epSaveBtn');
  saveBtn?.classList.add('is-loading');

  let body;
  try {
    if (_rawMode) {
      const raw = document.getElementById('rawContent')?.value ?? '';
      try { JSON.parse(raw); } catch(e) { toast('Invalid JSON: ' + e.message, 'error'); return; }
      body = { content: raw };
      showSaveWarnings(await api(`/_/api/endpoints/${type}/${name}?raw=true`, { method: 'PUT', body, success: 'Saved', failure: 'Save failed' }));
      _dirty = false; syncDirty();
      await refreshAll();
    } else {
      const errs = validateForm(type);
      if (errs.length) { showFieldErrors(errs); return; }
      const cfg = applyLifecycle(collectFormConfig(type, _detailData.content));
      body = { content: cfg };
      showSaveWarnings(await api(`/_/api/endpoints/${type}/${name}`, { method: 'PUT', body, success: 'Saved', failure: 'Save failed', silent: true }));
      _dirty = false; syncDirty();
      await refreshAll();
    }
  } catch(e) { if (!_rawMode) showServerErrors(e); }
  finally { saveBtn?.classList.remove('is-loading'); }
}

function showSaveWarnings(result) {
  for (const warning of result?.warnings ?? []) toast(warning, 'warning');
}

const NAME_PART = /^[a-zA-Z0-9_-]+$/;

function createContent(errors, baseName) {
  const val = id => document.getElementById(id)?.value?.trim() ?? '';
  const methods = readMethods('createMethodPicker');
  const envs = readEnvs();
  const hidden = document.getElementById('createHidden')?.checked ?? false;
  const doc = readDocumentation({});
  const needMethods = () => { if (!methods.length) errors.push(fieldError('createMethodPicker', 'Select at least one method')); };
  const extras = () => ({ ...(doc ? { Documentation: doc } : {}) });

  switch(_createType) {
    case 'sql':
      requireText(errors, 'createObjectName', 'Object Name is required');
      needMethods();
      return {
        DatabaseObjectName: val('createObjectName'),
        DatabaseSchema: val('createSchema') || undefined,
        DatabaseObjectType: keepDefault({}, 'DatabaseObjectType', document.getElementById('createObjectType')?.value ?? 'Table', 'Table'),
        AllowedMethods: methods,
        AllowedEnvironments: envs,
        Hidden: hidden,
        DisplayName: val('createDisplayName') || undefined,
        NamespaceDisplayName: val('createNamespaceDisplayName') || undefined,
        ...extras()
      };
    case 'proxy':
      requireText(errors, 'createUrl', 'URL is required');
      needMethods();
      return { Url: val('createUrl'), Methods: methods, AllowedEnvironments: envs, Hidden: hidden, ...extras() };
    case 'composite': {
      requireText(errors, 'createUrl', 'URL is required');
      needMethods();
      let steps = [];
      try { steps = JSON.parse(val('createSteps') || '[]'); } catch { /* reported by validateDocFields */ }
      return { Type: 'Composite', Url: val('createUrl'), Methods: methods, AllowedEnvironments: envs, Hidden: hidden, CompositeConfig: { Steps: steps }, ...extras() };
    }
    case 'file':
      requireText(errors, 'createBaseDir', 'Base Directory is required');
      return {
        StorageType: document.getElementById('createStorageType')?.value ?? 'Local',
        BaseDirectory: val('createBaseDir'),
        AllowedExtensions: val('createExtensions').split(',').map(x => x.trim()).filter(Boolean),
        AllowedEnvironments: envs,
        Hidden: hidden
      };
    case 'static':
      requireText(errors, 'createContentFile', 'Content File is required');
      return {
        ContentFile: val('createContentFile'),
        ContentType: val('createContentType') || 'application/json',
        EnableFiltering: document.getElementById('createEnableFiltering')?.checked ?? false,
        AllowedEnvironments: envs,
        Hidden: hidden
      };
    case 'webhook':
      if (!NAME_PART.test(val('createNamespace'))) errors.push(fieldError('createNamespace', 'Namespace is required: letters, numbers, hyphens or underscores'));
      validateWebhookIds(errors, 'createWebhookIds');
      return {
        DatabaseObjectName: val('createObjectName') || 'WebhookData',
        DatabaseSchema: val('createSchema') || undefined,
        AllowedMethods: ['POST'],
        AllowedColumns: readColumns('createWebhookIds'),
        AllowedEnvironments: envs
      };
  }
  return {};
}

async function submitCreate() {
  const errors = [];
  const baseName = (document.getElementById('createName')?.value ?? '').trim();
  const nameOk = baseName.split('/').every(part => NAME_PART.test(part));
  if (!baseName) errors.push(fieldError('createName', 'Name is required'));
  else if (!nameOk) errors.push(fieldError('createName', 'Use letters, numbers, hyphens or underscores; slashes separate namespaces'));
  const webhookNamespace = (document.getElementById('createNamespace')?.value ?? '').trim();
  const name = _createType === 'webhook' && webhookNamespace ? `${webhookNamespace}/${baseName}` : baseName;

  const content = createContent(errors, baseName);
  validateEnvs(errors);
  validateDocFields(errors);
  if (errors.length) { showFieldErrors(errors); return; }

  try {
    showSaveWarnings(await api(`/_/api/endpoints/${_createType}`, {
      method: 'POST',
      body: { name, content: JSON.stringify(content, null, 2) },
      success: `${name} created`, failure: 'Create failed', silent: true
    }));
    await closeCreateDrawer();
    await refreshAll();
    selectEndpoint(_createType, name);
  } catch(e) { showServerErrors(e); }
}
