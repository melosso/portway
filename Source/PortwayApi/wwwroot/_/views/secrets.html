<style>
    main {
        display: flex;
        flex-direction: column;
    }
    .secrets-add {
        margin-bottom: 0.75rem;
    }
    .secrets-add select.input {
        flex: 0 1 11rem;
    }
    .secret-uses {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem;
    }
    .secret-uses code {
        font-size: 0.75rem;
    }
    .secret-actions {
        display: flex;
        gap: 0.375rem;
        justify-content: flex-end;
    }
    @media (max-width: 640px) {
        .secrets-add {
            flex-wrap: wrap;
        }
        .secrets-add select.input,
        .secrets-add .input {
            flex: 1 1 100%;
        }
    }
</style>

<main>
    <div class="page-header">
        <div class="page-title">
            <div class="page-heading">
                <h1 class="select-none">Secrets</h1>
                <p class="page-sub">Encrypted per environment. Referenced as <code>${secret:NAME}</code>.</p>
            </div>
        </div>
        <div class="page-actions">
            <button class="btn btn-outline" onclick="loadSecrets()">
                <svg
                    width="13"
                    height="13"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <polyline points="23 4 23 10 17 10" />
                    <polyline points="1 20 1 14 7 14" />
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
                </svg>
                Refresh
            </button>
        </div>
    </div>

    <div class="main-content-fill">
        <form class="kv-row secret-add secrets-add" id="secretAddForm" hidden onsubmit="event.preventDefault(); addSecret()">
            <select class="input" id="newSecretEnv" aria-label="Environment"></select>
            <input
                type="text"
                id="newSecretName"
                class="input secret-name-input"
                placeholder="NAME"
                maxlength="64"
                autocomplete="off"
                spellcheck="false"
                aria-label="Secret name"
            />
            <input
                type="password"
                id="newSecretValue"
                class="input input-secret"
                placeholder="Value"
                autocomplete="new-password"
                aria-label="Secret value"
            />
            <button type="submit" class="btn btn-primary">Add secret</button>
        </form>

        <div class="filter-bar">
            <div class="filter-btns" id="secretTabs" role="group" aria-label="Filter"></div>
            <div class="search-wrap">
                <svg
                    width="13"
                    height="13"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input
                    type="text"
                    class="input"
                    id="secretSearch"
                    placeholder="Search secrets…"
                    aria-label="Search secrets"
                    oninput="renderSecrets()"
                />
            </div>
        </div>

        <div class="table-wrap">
            <div class="scroll-area">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Environment</th>
                            <th>Status</th>
                            <th>Used by</th>
                            <th style="text-align:right; padding-right:1rem;" id="secretActionsHead">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="secretTableBody">
                        <tr>
                            <td colspan="5" class="empty-state">Loading…</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script>
const SECRET_NAME = /^[A-Za-z0-9-]{1,64}$/;
let _rows = [];
let _environments = [];
let _filter = 'all';
let _isAdmin = false;

function statusOf(r) {
  if (r.failed) return 'unreadable';
  if (!r.has_value) return 'missing';
  if (!r.used_by.length) return 'unused';
  return 'set';
}

const STATUS = {
  set:        { label: 'Set',        badge: 'badge-success' },
  missing:    { label: 'Missing',    badge: 'badge-error' },
  unused:     { label: 'Unused',     badge: 'badge-muted' },
  unreadable: { label: 'Unreadable', badge: 'badge-error' }
};

async function loadSecrets() {
  try {
    const d = await api('/_/api/secrets', { failure: 'Secrets not loaded' });
    _rows = d.secrets ?? [];
    _environments = d.environments ?? [];
    const select = document.getElementById('newSecretEnv');
    const current = select.value;
    select.innerHTML = _environments.map(e => `<option value="${esc(e)}">${esc(e)}</option>`).join('');
    if (_environments.includes(current)) select.value = current;
    renderSecrets();
  } catch (e) {
    document.getElementById('secretTableBody').innerHTML = `<tr><td colspan="5" class="empty-state">Secrets not loaded</td></tr>`;
  }
}

function renderTabs() {
  const count = key => _rows.filter(r => key === 'all' || statusOf(r) === key || (key === 'missing' && statusOf(r) === 'unreadable')).length;
  const tabs = [['all', 'All'], ['missing', 'Missing'], ['unused', 'Unused']];
  document.getElementById('secretTabs').innerHTML = tabs.map(([key, label]) => `
    <button class="filter-btn ${_filter === key ? 'active' : ''}" aria-pressed="${_filter === key}" onclick="setFilter('${key}')">
      ${label}
      <span class="filter-count">${count(key)}</span>
    </button>`).join('');
}

function setFilter(key) {
  _filter = key;
  renderSecrets();
}

function renderSecrets() {
  renderTabs();
  const q = document.getElementById('secretSearch').value.trim().toLowerCase();
  const rows = _rows.filter(r => {
    const s = statusOf(r);
    if (_filter === 'missing' && s !== 'missing' && s !== 'unreadable') return false;
    if (_filter === 'unused' && s !== 'unused') return false;
    return !q || r.name.toLowerCase().includes(q) || r.environment.toLowerCase().includes(q) || r.used_by.some(u => u.toLowerCase().includes(q));
  });
  const body = document.getElementById('secretTableBody');
  if (!rows.length) {
    body.innerHTML = `<tr><td colspan="5" class="empty-state">${_rows.length ? 'No matching secrets' : 'No secrets or references'}</td></tr>`;
    return;
  }
  body.innerHTML = rows.map(r => {
    const s = STATUS[statusOf(r)];
    const source = r.has_value && !r.in_file ? ' <span class="field-hint">Key Vault</span>' : '';
    const uses = r.used_by.length
      ? `<div class="secret-uses">${r.used_by.map(u => `<code>${esc(u)}</code>`).join('')}</div>`
      : '<span class="field-hint">None</span>';
    const actions = !_isAdmin ? '' : `<div class="secret-actions">
        <button type="button" class="btn btn-outline btn-sm" onclick="startSet(this)">${r.in_file ? 'Replace' : 'Set value'}</button>
        ${r.in_file ? `<button type="button" class="btn btn-outline btn-sm secret-delete" onclick="deleteSecret(this)">Delete</button>` : ''}
      </div>`;
    return `<tr data-env="${esc(r.environment)}" data-name="${esc(r.name)}">
      <td><span class="secret-name">${esc(r.name)}</span></td>
      <td>${esc(r.environment)}</td>
      <td><span class="badge ${s.badge}">${s.label}</span>${source}</td>
      <td>${uses}</td>
      <td style="padding-right:1rem;">${actions}</td>
    </tr>`;
  }).join('');
}

function startSet(btn) {
  const { env, name } = btn.closest('tr').dataset;
  document.getElementById('newSecretEnv').value = env;
  document.getElementById('newSecretName').value = name;
  document.getElementById('newSecretValue').value = '';
  document.getElementById('newSecretValue').focus();
}

async function putSecret(env, name, value) {
  await api(`/_/api/environments/${encodeURIComponent(env)}/secrets/${encodeURIComponent(name)}`, {
    method: 'PUT', body: { value }, success: `Saved ${name}`, failure: 'Save failed'
  });
}

async function addSecret() {
  const env = document.getElementById('newSecretEnv').value;
  const nameEl = document.getElementById('newSecretName');
  const valueEl = document.getElementById('newSecretValue');
  const name = nameEl.value.trim();
  if (!env) { toast('Add an environment first.', 'error'); return; }
  if (!SECRET_NAME.test(name)) { toast('Use letters, digits and hyphens, up to 64 characters.', 'error'); nameEl.focus(); return; }
  if (!valueEl.value.trim()) { toast('Enter a value.', 'error'); valueEl.focus(); return; }
  const submit = async () => {
    try {
      await putSecret(env, name, valueEl.value);
      nameEl.value = '';
      valueEl.value = '';
      await loadSecrets();
    } catch (e) {}
  };
  const exists = _rows.some(r => r.environment === env && r.in_file && r.name.toLowerCase() === name.toLowerCase());
  if (!exists) return submit();
  AlertDialog.show({ title: `Replace "${name}" in ${env}?`, description: 'The current value is overwritten.', actionLabel: 'Replace', onConfirm: submit });
}

function deleteSecret(btn) {
  const { env, name } = btn.closest('tr').dataset;
  AlertDialog.show({
    title: `Delete "${name}" from ${env}?`,
    description: 'References to this secret fail until a value is added again.',
    actionLabel: 'Delete',
    variant: 'destructive',
    onConfirm: async () => {
      try {
        await api(`/_/api/environments/${encodeURIComponent(env)}/secrets/${encodeURIComponent(name)}`, { method: 'DELETE', success: `Deleted ${name}`, failure: 'Delete failed' });
        await loadSecrets();
      } catch (e) {}
    }
  });
}

api('/_/api/users/me', { silent: true })
  .then(me => {
    _isAdmin = me?.role === 'administrator';
    document.getElementById('secretAddForm').hidden = !_isAdmin;
    document.getElementById('secretActionsHead').hidden = !_isAdmin;
  })
  .catch(() => {})
  .finally(loadSecrets);
</script>
