<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In · Portway</title>
  <link href="css/site.css" rel="stylesheet" />
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script src="js/components/tooltip.js"></script>
  <script src="js/connection.js"></script>
  <script src="js/theme-toggle.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/components/promobar.js"></script>
</head>
<body>

<div class="signin-theme">
  <button type="button" class="theme-toggle" id="themeToggle" onclick="cycleTheme()" data-tooltip="Toggle theme" aria-label="Toggle theme"></button>
</div>

<main class="signin">

  <div class="signin-mark select-none">
    <div class="brand-avatar" style="width:28px;height:28px">
      <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" class="brand-avatar-bg" aria-hidden="true">
          <g clip-path="url(#portway-login-clip)">
            <rect width="20" height="20" fill="#000" rx="5.5"/>
            <rect width="20" height="20" fill="url(#portway-login-grad)" fill-opacity="0.2" rx="5.5"/>
            <g filter="url(#portway-login-blur-1)" opacity="0.3"><circle cx="16" cy="17" r="6" fill="#FF64B4" fill-opacity="0.671"/></g>
            <g filter="url(#portway-login-blur-2)" opacity="0.1"><circle cx="16" cy="16" r="6" fill="#FF64B4" fill-opacity="0.671"/></g>
            <g filter="url(#portway-login-blur-3)" opacity="0.4"><circle cx="17" cy="19" r="6" fill="#FF64B4" fill-opacity="0.671"/></g>
            <rect width="20" height="20" fill="#FF64B4" fill-opacity="0.15" rx="5.5"/>
            <g style="mix-blend-mode:hard-light"><rect width="20" height="20" fill="#6A62FF" fill-opacity="0.1" rx="5.5"/></g>
          </g>
          <rect width="19" height="19" x="0.5" y="0.5" stroke="#FDFDFD" stroke-opacity="0.1" rx="5"/>
          <defs>
            <filter id="portway-login-blur-1" width="32" height="32" x="0" y="1" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
              <feFlood flood-opacity="0" result="BackgroundImageFix"/><feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"/><feGaussianBlur result="effect1_foregroundBlur" stdDeviation="5"/>
            </filter>
            <filter id="portway-login-blur-2" width="22" height="22" x="5" y="5" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
              <feFlood flood-opacity="0" result="BackgroundImageFix"/><feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"/><feGaussianBlur result="effect1_foregroundBlur" stdDeviation="2.5"/>
            </filter>
            <filter id="portway-login-blur-3" width="22" height="22" x="6" y="8" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
              <feFlood flood-opacity="0" result="BackgroundImageFix"/><feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"/><feGaussianBlur result="effect1_foregroundBlur" stdDeviation="2.5"/>
            </filter>
            <linearGradient id="portway-login-grad" x1="10" x2="10" y1="0" y2="20" gradientUnits="userSpaceOnUse">
              <stop stop-color="#FDFDFD"/><stop offset="1" stop-color="#FDFDFD" stop-opacity="0"/>
            </linearGradient>
            <clipPath id="portway-login-clip"><rect width="20" height="20" fill="#FDFDFD" rx="5.5"/></clipPath>
          </defs>
        </svg>
        <svg class="brand-avatar-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FDFDFD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
      </div>
    <span class="signin-wordmark">Portway</span>
  </div>

  <form class="signin-panel" onsubmit="event.preventDefault();signIn()">
    <header class="signin-header">
      <h1>Sign in</h1>
      <p>Please sign in to open the dashboard.</p>
    </header>

    <div class="field">
      <label class="field-label" for="usernameInput">Username</label>
      <input type="text" id="usernameInput" class="input" autocomplete="username"
             required autofocus aria-describedby="authError">
    </div>

    <div class="field">
      <label class="field-label" for="passwordInput">Password</label>
      <input type="password" id="passwordInput" class="input" autocomplete="current-password"
             required aria-describedby="authError">
    </div>

    <div class="field" id="newPasswordField" hidden>
      <label class="field-label" for="newPasswordInput">New password</label>
      <input type="password" id="newPasswordInput" class="input" autocomplete="new-password">
      <div class="field-help">At least 12 characters. Choose this yourself, the current one was not.</div>
    </div>

    <div class="signin-error" id="authError" role="alert" aria-live="assertive">Invalid username or password</div>

    <button type="submit" class="btn btn-primary btn-block signin-submit" id="signInBtn">
      <span class="btn-label">Sign In</span><span class="btn-spinner"></span>
    </button>
  </form>

  <div class="signin-sso" id="ssoBlock" hidden>
    <p class="signin-or">or</p>
    <div class="signin-providers" id="ssoProviders"></div>
  </div>

  <div class="signin-footer-main"><!-- LOGIN_FOOTER_PLACEHOLDER --></div>

</main>

<script>

  let csrfToken = '';

  async function initCsrf() {
    try {
      const r = await fetch('/ui/api/auth/csrf');
      if (r.ok) {
        const d = await r.json();
        csrfToken = d.csrf;
      }
    } catch(e) {
      console.error('Failed to fetch CSRF token:', e);
    }
  }
  initCsrf();

  async function initProviders() {
    const base = window.PortwayBase || '';
    let providers = [];
    try {
      const r = await fetch(base + '/ui/api/auth/providers');
      if (!r.ok) return;
      providers = (await r.json()).providers || [];
    } catch(e) {
      return;
    }
    if (!providers.length) return;
    const host = document.getElementById('ssoProviders');
    for (const p of providers) {
      const a = document.createElement('a');
      a.className = 'btn btn-outline sso-btn';
      a.rel = 'nofollow';
      a.href = base + '/ui/api/auth/oidc/' + encodeURIComponent(p.slug) + '/start';
      a.textContent = 'Continue with ' + p.name;
      host.append(a);
    }
    document.getElementById('ssoBlock').hidden = false;
  }
  initProviders();

  // A federated sign-in that was refused comes back here with a reason
  (function () {
    const reason = new URLSearchParams(location.search).get('sso');
    if (!reason) return;
    const messages = {
      failed:     'That sign-in could not be completed. Check the server log.',
      denied:     'The sign-in was cancelled.',
      no_account: 'That account is not allowed to use this console.',
      inactive:   'That account is inactive.',
    };
    const err = document.getElementById('authError');
    err.textContent = messages[reason] ?? messages.failed;
    err.style.display = 'block';
    history.replaceState(null, '', location.pathname);
  })();

  let _changing = false;

  async function signIn() {
    const username = document.getElementById('usernameInput').value;
    const password = document.getElementById('passwordInput').value;
    const newPassword = document.getElementById('newPasswordInput').value;
    const btn = document.getElementById('signInBtn');
    const err = document.getElementById('authError');
    err.style.display = 'none';
    btn.classList.add('is-loading');
    btn.disabled = true;
    try {
      const r = await fetch(_changing ? '/ui/api/auth/password' : '/ui/api/auth', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, newPassword, csrf: csrfToken })
      });
      const d = await r.json().catch(() => ({}));

      // A first sign-in stops here: the account picks its own password before it gets a session
      if (r.ok && d.must_change_password) {
        _changing = true;
        document.getElementById('newPasswordField').hidden = false;
        document.querySelector('.signin-header p').textContent = 'Choose a new password to finish signing in.';
        document.querySelector('#signInBtn .btn-label').textContent = 'Set password';
        err.style.display = 'none';
        btn.classList.remove('is-loading');
        btn.disabled = false;
        document.getElementById('newPasswordInput').focus();
        return;
      }

      if (r.ok) {
        window.location.href = (window.PortwayBase || '') + '/ui/dashboard';
      } else {
        err.textContent = d.error || 'Invalid username or password';
        err.style.display = 'block';
        btn.classList.remove('is-loading');
        btn.disabled = false;
        document.getElementById('passwordInput').focus();
        initCsrf();
      }
    } catch(e) {
      err.textContent = 'Connection error. Is the server running?';
      err.style.display = 'block';
      btn.classList.remove('is-loading');
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
